<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>initHUB Cloud Enterprise</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    <style>
        .github-dark { background-color: #0d1117; color: #c9d1d9; }
        .github-card { background: #161b22; border: 1px solid #30363d; border-radius: 0.5rem; padding: 1.5rem; }
        .btn-primary { background: #2563eb; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; transition: background-color 0.2s; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #161b22; border: 1px solid #30363d; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; transition: background-color 0.2s; }
        .btn-secondary:hover { background: #374151; }
        .sidebar { width: 16rem; background: #161b22; border-right: 1px solid #30363d; min-height: 100vh; }
        .nav-item { display: flex; align-items: center; padding: 0.75rem 1rem; margin: 0.25rem 0; border-radius: 0.5rem; transition: all 0.2s; }
        .nav-item.active { background: #2563eb; color: white; }
        .nav-item:not(.active):hover { background: #374151; color: white; }
        .logo-container { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; border-bottom: 1px solid #30363d; }
        .logo { width: 2rem; height: 2rem; border-radius: 0.5rem; }
    </style>
</head>
<body class="github-dark min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;
        const { 
            Home, GitBranch, Bot, BarChart3, Download, BookOpen, 
            LogOut, User, Settings, Plus, Search, Star, GitFork, 
            Lock, Globe, Eye, Code, MessageSquare, Send,
            ChevronDown, Bell, Mail
        } = lucideReact;

        // Context d'authentification
        const AuthContext = createContext();

        function AuthProvider({ children }) {
            const [user, setUser] = useState(null);
            const [token, setToken] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const savedToken = localStorage.getItem('inithub_token');
                const savedUser = localStorage.getItem('inithub_user');
                
                if (savedToken && savedUser) {
                    setToken(savedToken);
                    setUser(JSON.parse(savedUser));
                }
                setLoading(false);
            }, []);

            const login = async (email, password) => {
                try {
                    const response = await fetch('https://hubs-pro.onrender.com/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email, password }),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || 'Erreur de connexion');
                    }

                    const data = await response.json();
                    
                    const tempUser = {
                        id: 1,
                        username: email.split('@')[0],
                        email: email,
                        full_name: 'Utilisateur initHUB'
                    };
                    
                    localStorage.setItem('inithub_token', data.access_token);
                    localStorage.setItem('inithub_user', JSON.stringify(tempUser));
                    setToken(data.access_token);
                    setUser(tempUser);
                    
                    return { success: true };
                } catch (error) {
                    console.error('Erreur login:', error);
                    return { 
                        success: false, 
                        error: error.message 
                    };
                }
            };

            const register = async (userData) => {
                try {
                    const response = await fetch('https://hubs-pro.onrender.com/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(userData),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || 'Erreur d\'inscription');
                    }

                    const data = await response.json();
                    
                    return { success: true, data };
                } catch (error) {
                    console.error('Erreur register:', error);
                    return { 
                        success: false, 
                        error: error.message 
                    };
                }
            };

            const logout = () => {
                localStorage.removeItem('inithub_token');
                localStorage.removeItem('inithub_user');
                setUser(null);
                setToken(null);
                window.location.hash = '';
            };

            return React.createElement(AuthContext.Provider, {
                value: {
                    user,
                    token,
                    loading,
                    login,
                    register,
                    logout
                }
            }, children);
        }

        function useAuth() {
            const context = useContext(AuthContext);
            if (!context) {
                throw new Error('useAuth must be used within AuthProvider');
            }
            return context;
        }

        // Composants UI
        function Logo() {
            return React.createElement('div', { className: 'logo-container' },
                React.createElement('img', {
                    src: 'https://github.com/user-attachments/assets/d381e360-9daa-4423-a5c4-e6906b7f4afe',
                    alt: 'initHUB Logo',
                    className: 'logo'
                }),
                React.createElement('span', { 
                    className: 'text-white font-bold text-lg'
                }, 'initHUB')
            );
        }

        function Header() {
            const { user, logout } = useAuth();

            if (!user) return null;

            return React.createElement('header', {
                className: 'bg-gray-800 border-b border-gray-700'
            }, 
                React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8' },
                    React.createElement('div', { className: 'flex justify-between items-center h-16' },
                        React.createElement('div', { className: 'flex items-center' },
                            React.createElement('h1', { className: 'text-xl font-bold text-white' }, 'Tableau de bord')
                        ),
                        React.createElement('div', { className: 'flex items-center space-x-4' },
                            React.createElement('button', { className: 'p-2 text-gray-400 hover:text-white' },
                                React.createElement(Bell, { size: 20 })
                            ),
                            React.createElement('button', { className: 'p-2 text-gray-400 hover:text-white' },
                                React.createElement(Mail, { size: 20 })
                            ),
                            React.createElement('div', { className: 'flex items-center space-x-2' },
                                React.createElement('div', { 
                                    className: 'w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center'
                                },
                                    React.createElement('span', { className: 'text-white text-sm font-bold' }, 
                                        user.username ? user.username.charAt(0).toUpperCase() : 'U'
                                    )
                                ),
                                React.createElement('span', { className: 'text-sm text-gray-300' }, user.username),
                                React.createElement(ChevronDown, { size: 16, className: 'text-gray-400' })
                            ),
                            React.createElement('button', {
                                onClick: logout,
                                className: 'p-2 text-gray-400 hover:text-red-400',
                                title: 'Déconnexion'
                            }, React.createElement(LogOut, { size: 20 }))
                        )
                    )
                )
            );
        }

        function Sidebar() {
            const { user } = useAuth();
            const [currentRoute, setCurrentRoute] = useState(window.location.hash.replace('#', '') || 'dashboard');

            const navigation = [
                { name: 'Dashboard', href: 'dashboard', icon: Home },
                { name: 'Repositories', href: 'repos', icon: GitBranch },
                { name: 'Copilot', href: 'copilot', icon: Bot },
                { name: 'Releases', href: 'releases', icon: Download },
                { name: 'Wiki', href: 'wiki', icon: BookOpen },
                { name: 'Analytics', href: 'analytics', icon: BarChart3 },
            ];

            if (!user) return null;

            return React.createElement('div', { className: 'sidebar' },
                React.createElement(Logo),
                React.createElement('nav', { className: 'mt-4 px-4' },
                    React.createElement('ul', { className: 'space-y-1' },
                        navigation.map((item) => {
                            const Icon = item.icon;
                            const isActive = currentRoute === item.href;
                            
                            return React.createElement('li', { key: item.name },
                                React.createElement('button', {
                                    className: `nav-item w-full text-left ${isActive ? 'active' : 'text-gray-300'}`,
                                    onClick: () => {
                                        setCurrentRoute(item.href);
                                        window.location.hash = item.href;
                                    }
                                },
                                    React.createElement(Icon, { size: 20, className: 'mr-3' }),
                                    item.name
                                )
                            );
                        })
                    )
                )
            );
        }

        function Layout({ children }) {
            const { user } = useAuth();

            if (!user) {
                return children;
            }

            return React.createElement('div', { className: 'flex' },
                React.createElement(Sidebar),
                React.createElement('div', { className: 'flex-1 flex flex-col' },
                    React.createElement(Header),
                    React.createElement('main', { className: 'flex-1 p-8' }, children)
                )
            );
        }

        // Pages
        function HomePage() {
            const [isLogin, setIsLogin] = useState(true);
            const [formData, setFormData] = useState({
                email: '',
                password: '',
                username: '',
                full_name: ''
            });
            const [message, setMessage] = useState('');
            const { user, login, register, loading } = useAuth();

            useEffect(() => {
                if (user) {
                    window.location.hash = 'dashboard';
                }
            }, [user]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setMessage('');
                
                let result;
                if (isLogin) {
                    result = await login(formData.email, formData.password);
                } else {
                    result = await register(formData);
                }
                
                if (result.success) {
                    setMessage('✅ Connexion réussie! Redirection...');
                } else {
                    setMessage(`❌ ${result.error}`);
                }
            };

            if (user) {
                return React.createElement('div', {
                    className: 'min-h-screen flex items-center justify-center'
                },
                    React.createElement('div', { className: 'text-center' },
                        React.createElement('div', { className: 'animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto' }),
                        React.createElement('p', { className: 'text-gray-400 mt-4' }, 'Redirection...')
                    )
                );
            }

            const features = [
                {
                    icon: React.createElement(GitBranch, { size: 32 }),
                    title: 'Git Repository Hosting',
                    description: 'Hébergement de repositories Git avec support LFS'
                },
                {
                    icon: React.createElement(Bot, { size: 32 }),
                    title: 'Copilot IA intégré',
                    description: 'Assistant IA pour le développement'
                },
                {
                    icon: React.createElement(BarChart3, { size: 32 }),
                    title: 'Dashboard Analytics',
                    description: 'Analyses détaillées et métriques'
                },
                {
                    icon: React.createElement(Download, { size: 32 }),
                    title: 'Releases & Assets',
                    description: 'Gestion des releases et assets'
                },
                {
                    icon: React.createElement(BookOpen, { size: 32 }),
                    title: 'Wiki Documentation',
                    description: 'Documentation intégrée avec wiki'
                }
            ];

            return React.createElement('div', { className: 'min-h-screen' },
                React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8' },
                    React.createElement('div', { className: 'pt-8 pb-16 text-center' },
                        React.createElement('div', { className: 'flex items-center justify-center mb-6' },
                            React.createElement('img', {
                                src: 'https://github.com/user-attachments/assets/d381e360-9daa-4423-a5c4-e6906b7f4afe',
                                alt: 'initHUB Logo',
                                className: 'w-16 h-16 rounded-lg mr-4'
                            }),
                            React.createElement('h1', { className: 'text-5xl font-bold text-white' }, 'initHUB Cloud')
                        ),
                        React.createElement('p', { className: 'text-xl text-gray-300 mb-8' }, 'Plateforme cloud complète avec Copilot, Dashboard, Releases et Analytics')
                    ),

                    React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-12 mb-16' },
                        React.createElement('div', { className: 'github-card' },
                            React.createElement('h2', { className: 'text-2xl font-bold text-white mb-6' },
                                isLogin ? 'Connexion' : 'Inscription'
                            ),
                            
                            message && React.createElement('div', {
                                className: `p-3 rounded-lg mb-4 ${
                                    message.includes('✅') ? 'bg-green-500' : 'bg-red-500'
                                } text-white`
                            }, message),
                            
                            React.createElement('form', { onSubmit: handleSubmit, className: 'space-y-4' },
                                !isLogin && [
                                    React.createElement('div', { key: 'username' },
                                        React.createElement('label', { className: 'block text-sm font-medium text-gray-300 mb-2' }, 'Nom d\'utilisateur'),
                                        React.createElement('input', {
                                            type: 'text',
                                            required: true,
                                            className: 'w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-md text-white',
                                            value: formData.username,
                                            onChange: (e) => setFormData({...formData, username: e.target.value})
                                        })
                                    ),
                                    React.createElement('div', { key: 'fullname' },
                                        React.createElement('label', { className: 'block text-sm font-medium text-gray-300 mb-2' }, 'Nom complet'),
                                        React.createElement('input', {
                                            type: 'text',
                                            className: 'w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-md text-white',
                                            value: formData.full_name,
                                            onChange: (e) => setFormData({...formData, full_name: e.target.value})
                                        })
                                    )
                                ],
                                
                                React.createElement('div', { key: 'email' },
                                    React.createElement('label', { className: 'block text-sm font-medium text-gray-300 mb-2' }, 'Email'),
                                    React.createElement('input', {
                                        type: 'email',
                                        required: true,
                                        className: 'w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-md text-white',
                                        value: formData.email,
                                        onChange: (e) => setFormData({...formData, email: e.target.value})
                                    })
                                ),
                                
                                React.createElement('div', { key: 'password' },
                                    React.createElement('label', { className: 'block text-sm font-medium text-gray-300 mb-2' }, 'Mot de passe'),
                                    React.createElement('input', {
                                        type: 'password',
                                        required: true,
                                        className: 'w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-md text-white',
                                        value: formData.password,
                                        onChange: (e) => setFormData({...formData, password: e.target.value})
                                    })
                                ),
                                
                                React.createElement('button', {
                                    type: 'submit',
                                    disabled: loading,
                                    className: 'w-full btn-primary py-3'
                                }, loading ? 'Chargement...' : (isLogin ? 'Se connecter' : 'Créer un compte'))
                            ),
                            
                            React.createElement('div', { className: 'mt-4 text-center' },
                                React.createElement('button', {
                                    onClick: () => setIsLogin(!isLogin),
                                    className: 'text-blue-400 hover:text-blue-300'
                                }, isLogin ? 'Créer un compte' : 'Déjà un compte ? Se connecter')
                            )
                        ),

                        React.createElement('div', null,
                            React.createElement('h3', { className: 'text-2xl font-bold text-white mb-6' }, 'Fonctionnalités'),
                            React.createElement('div', { className: 'grid gap-4' },
                                features.map((feature, index) =>
                                    React.createElement('div', {
                                        key: index,
                                        className: 'github-card flex items-start space-x-4'
                                    },
                                        React.createElement('div', { className: 'text-blue-400 flex-shrink-0' }, feature.icon),
                                        React.createElement('div', null,
                                            React.createElement('h4', { className: 'text-lg font-semibold text-white mb-1' }, feature.title),
                                            React.createElement('p', { className: 'text-gray-400' }, feature.description)
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }

        function StatsCard({ title, value, icon, color = 'blue' }) {
            const colorClasses = {
                blue: 'bg-blue-500',
                green: 'bg-green-500',
                yellow: 'bg-yellow-500',
                purple: 'bg-purple-500',
            };

            return React.createElement('div', { className: 'github-card' },
                React.createElement('div', { className: 'flex items-center' },
                    React.createElement('div', { className: `p-3 rounded-lg ${colorClasses[color]} text-white` }, icon),
                    React.createElement('div', { className: 'ml-4' },
                        React.createElement('p', { className: 'text-sm font-medium text-gray-300' }, title),
                        React.createElement('p', { className: 'text-2xl font-bold text-white' }, value)
                    )
                )
            );
        }

        function DashboardPage() {
            const { user } = useAuth();
            const [stats, setStats] = useState(null);
            const [recentActivity, setRecentActivity] = useState([]);

            useEffect(() => {
                if (!user) {
                    window.location.hash = '';
                    return;
                }

                // Données simulées
                setStats({
                    total_repos: 12,
                    total_stars: 45,
                    total_forks: 8,
                    total_contributors: 5
                });

                setRecentActivity([
                    {
                        type: 'repo',
                        title: 'mon-projet',
                        date: new Date().toISOString(),
                        description: 'Repository créé'
                    },
                    {
                        type: 'commit',
                        title: 'Initial commit',
                        date: new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString(),
                        description: 'Commit pushed'
                    },
                    {
                        type: 'pr',
                        title: 'Add new feature',
                        date: new Date(Date.now() - 5 * 60 * 60 * 1000).toISOString(),
                        description: 'Pull request opened'
                    }
                ]);
            }, [user]);

            if (!user) return null;

            return React.createElement('div', { className: 'max-w-7xl mx-auto' },
                React.createElement('h1', { className: 'text-3xl font-bold text-white mb-8' }, 'Dashboard'),
                
                stats && React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8' },
                    React.createElement(StatsCard, {
                        title: 'Repositories',
                        value: stats.total_repos,
                        icon: React.createElement(GitBranch, { size: 24 }),
                        color: 'blue'
                    }),
                    React.createElement(StatsCard, {
                        title: 'Stars',
                        value: stats.total_stars,
                        icon: React.createElement(Star, { size: 24 }),
                        color: 'yellow'
                    }),
                    React.createElement(StatsCard, {
                        title: 'Forks',
                        value: stats.total_forks,
                        icon: React.createElement(GitFork, { size: 24 }),
                        color: 'green'
                    }),
                    React.createElement(StatsCard, {
                        title: 'Contributeurs',
                        value: stats.total_contributors,
                        icon: React.createElement(User, { size: 24 }),
                        color: 'purple'
                    })
                ),

                React.createElement('div', { className: 'github-card' },
                    React.createElement('h2', { className: 'text-xl font-bold text-white mb-4' }, 'Activité récente'),
                    React.createElement('div', { className: 'space-y-3' },
                        recentActivity.map((activity, index) =>
                            React.createElement('div', {
                                key: index,
                                className: 'flex items-center space-x-3 p-3 bg-gray-800 rounded-lg'
                            },
                                React.createElement(BarChart3, { size: 16, className: 'text-gray-400' }),
                                React.createElement('div', null,
                                    React.createElement('p', { className: 'text-white text-sm' }, activity.description),
                                    React.createElement('p', { className: 'text-gray-400 text-xs' },
                                        new Date(activity.date).toLocaleDateString('fr-FR')
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }

        function RepositoryCard({ repo }) {
            const handleClick = () => {
                window.location.hash = `repo/${repo.full_name}`;
            };

            return React.createElement('div', { 
                className: 'github-card hover:border-gray-500 transition-colors cursor-pointer',
                onClick: handleClick
            },
                React.createElement('div', { className: 'flex items-start justify-between mb-3' },
                    React.createElement('div', { className: 'flex items-center space-x-2' },
                        React.createElement('h3', { className: 'text-xl font-semibold text-blue-400' }, repo.name),
                        repo.is_private ? 
                            React.createElement(Lock, { size: 16, className: 'text-gray-400' }) :
                            React.createElement(Globe, { size: 16, className: 'text-gray-400' })
                    ),
                    React.createElement('button', { className: 'btn-secondary text-sm' },
                        React.createElement(Star, { size: 16, className: 'mr-1' }),
                        'Star'
                    )
                ),
                React.createElement('p', { className: 'text-gray-400 mb-4 line-clamp-2' }, repo.description || 'Aucune description'),
                React.createElement('div', { className: 'flex items-center space-x-4 text-sm text-gray-400' },
                    React.createElement('div', { className: 'flex items-center' },
                        React.createElement('span', { 
                            className: `w-3 h-3 rounded-full mr-1 ${
                                repo.language === 'JavaScript' ? 'bg-yellow-400' :
                                repo.language === 'Python' ? 'bg-blue-400' :
                                repo.language === 'HTML' ? 'bg-red-400' :
                                repo.language === 'CSS' ? 'bg-purple-400' : 'bg-gray-400'
                            }` 
                        }),
                        repo.language || 'Text'
                    ),
                    React.createElement('div', { className: 'flex items-center' },
                        React.createElement(Star, { size: 16, className: 'mr-1' }),
                        repo.stars_count
                    ),
                    React.createElement('div', { className: 'flex items-center' },
                        React.createElement(GitFork, { size: 16, className: 'mr-1' }),
                        repo.forks_count
                    ),
                    React.createElement('span', null, `Mis à jour le ${new Date(repo.updated_at).toLocaleDateString('fr-FR')}`)
                )
            );
        }

        function ReposPage() {
            const { user } = useAuth();
            const [repos, setRepos] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                if (!user) {
                    window.location.hash = '';
                    return;
                }

                // Données simulées
                setTimeout(() => {
                    setRepos([
                        {
                            id: 1,
                            name: 'mon-projet',
                            full_name: `${user.username}/mon-projet`,
                            description: 'Mon premier projet sur initHUB avec une description plus longue pour tester',
                            is_private: false,
                            stars_count: 5,
                            forks_count: 2,
                            language: 'JavaScript',
                            updated_at: new Date().toISOString()
                        },
                        {
                            id: 2,
                            name: 'api-backend',
                            full_name: `${user.username}/api-backend`,
                            description: 'Backend API en Node.js avec Express et MongoDB',
                            is_private: true,
                            stars_count: 3,
                            forks_count: 1,
                            language: 'Python',
                            updated_at: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString()
                        }
                    ]);
                    setLoading(false);
                }, 1000);
            }, [user]);

            const filteredRepos = repos.filter(repo =>
                repo.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                (repo.description && repo.description.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            if (!user) return null;

            return React.createElement('div', { className: 'max-w-7xl mx-auto' },
                React.createElement('div', { className: 'flex justify-between items-center mb-8' },
                    React.createElement('div', null,
                        React.createElement('h1', { className: 'text-3xl font-bold text-white' }, 'Repositories'),
                        React.createElement('p', { className: 'text-gray-400 mt-2' }, 'Gérez vos dépôts de code')
                    ),
                    React.createElement('button', { className: 'btn-primary flex items-center' },
                        React.createElement(Plus, { size: 20, className: 'mr-2' }),
                        'Nouveau repository'
                    )
                ),

                React.createElement('div', { className: 'github-card mb-6' },
                    React.createElement('div', { className: 'relative' },
                        React.createElement(Search, { 
                            size: 20, 
                            className: 'absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400' 
                        }),
                        React.createElement('input', {
                            type: 'text',
                            placeholder: 'Rechercher un repository...',
                            className: 'w-full pl-10 pr-4 py-2 bg-gray-800 border border-gray-700 rounded-md text-white',
                            value: searchTerm,
                            onChange: (e) => setSearchTerm(e.target.value)
                        })
                    )
                ),

                loading ? 
                    React.createElement('div', { className: 'github-card text-center py-12' },
                        React.createElement('div', { className: 'animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto' }),
                        React.createElement('p', { className: 'text-gray-400 mt-4' }, 'Chargement des repositories...')
                    ) :
                    React.createElement('div', { className: 'grid gap-4' },
                        filteredRepos.map((repo) =>
                            React.createElement(RepositoryCard, { key: repo.id, repo: repo })
                        ),
                        filteredRepos.length === 0 && 
                            React.createElement('div', { className: 'github-card text-center py-12' },
                                React.createElement('p', { className: 'text-gray-400 text-lg' },
                                    searchTerm ? 'Aucun repository trouvé' : 'Aucun repository'
                                ),
                                !searchTerm && 
                                    React.createElement('button', { className: 'btn-primary mt-4' },
                                        React.createElement(Plus, { size: 20, className: 'mr-2' }),
                                        'Créer votre premier repository'
                                    )
                            )
                    )
            );
        }

        function CopilotChat({ token }) {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const messagesEndRef = React.useRef(null);

            const scrollToBottom = () => {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
                }
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const sendMessage = async () => {
                if (!input.trim() || loading) return;

                const userMessage = {
                    id: Date.now(),
                    type: 'user',
                    content: input,
                    timestamp: new Date()
                };

                setMessages(prev => [...prev, userMessage]);
                setInput('');
                setLoading(true);

                try {
                    const response = await fetch('https://hubs-pro.onrender.com/api/copilot/ask', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            question: input,
                            language: 'fr'
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Erreur API Copilot');
                    }

                    const data = await response.json();

                    const botMessage = {
                        id: Date.now() + 1,
                        type: 'bot',
                        content: data.response,
                        timestamp: new Date()
                    };

                    setMessages(prev => [...prev, botMessage]);
                } catch (error) {
                    console.error('Erreur Copilot:', error);
                    
                    const errorMessage = {
                        id: Date.now() + 1,
                        type: 'bot',
                        content: 'Désolé, une erreur est survenue. Veuillez réessayer.',
                        timestamp: new Date()
                    };
                    
                    setMessages(prev => [...prev, errorMessage]);
                } finally {
                    setLoading(false);
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            return React.createElement('div', { className: 'flex flex-col h-[600px] github-card' },
                React.createElement('div', { className: 'flex-1 overflow-y-auto p-4 space-y-4' },
                    messages.length === 0 && 
                        React.createElement('div', { className: 'text-center text-gray-400 py-8' },
                            React.createElement(Bot, { size: 48, className: 'mx-auto mb-4 text-blue-400' }),
                            React.createElement('p', null, 'Bonjour ! Je suis Copilot, votre assistant IA.'),
                            React.createElement('p', null, 'Comment puis-je vous aider aujourd\'hui ?')
                        ),
                    
                    messages.map((message) =>
                        React.createElement('div', {
                            key: message.id,
                            className: `flex ${message.type === 'user' ? 'justify-end' : 'justify-start'}`
                        },
                            React.createElement('div', {
                                className: `max-w-[80%] rounded-lg p-4 ${
                                    message.type === 'user' ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-100'
                                }`
                            },
                                React.createElement('div', { className: 'flex items-center mb-2' },
                                    message.type === 'user' ? 
                                        React.createElement(User, { size: 16, className: 'mr-2' }) :
                                        React.createElement(Bot, { size: 16, className: 'mr-2' }),
                                    React.createElement('span', { className: 'text-sm font-medium' },
                                        message.type === 'user' ? 'Vous' : 'Copilot'
                                    )
                                ),
                                React.createElement('p', { className: 'whitespace-pre-wrap' }, message.content),
                                React.createElement('p', { className: 'text-xs opacity-70 mt-2' },
                                    message.timestamp.toLocaleTimeString('fr-FR')
                                )
                            )
                        )
                    ),
                    
                    loading && 
                        React.createElement('div', { className: 'flex justify-start' },
                            React.createElement('div', { className: 'bg-gray-700 rounded-lg p-4 max-w-[80%]' },
                                React.createElement('div', { className: 'flex items-center' },
                                    React.createElement(Bot, { size: 16, className: 'mr-2 text-blue-400' }),
                                    React.createElement('span', { className: 'text-sm font-medium' }, 'Copilot')
                                ),
                                React.createElement('div', { className: 'flex space-x-2 mt-2' },
                                    React.createElement('div', { 
                                        className: 'w-2 h-2 bg-gray-400 rounded-full animate-bounce' 
                                    }),
                                    React.createElement('div', { 
                                        className: 'w-2 h-2 bg-gray-400 rounded-full animate-bounce',
                                        style: { animationDelay: '0.2s' }
                                    }),
                                    React.createElement('div', { 
                                        className: 'w-2 h-2 bg-gray-400 rounded-full animate-bounce',
                                        style: { animationDelay: '0.4s' }
                                    })
                                )
                            )
                        ),
                    
                    React.createElement('div', { ref: messagesEndRef })
                ),

                React.createElement('div', { className: 'border-t border-gray-700 p-4' },
                    React.createElement('div', { className: 'flex space-x-4' },
                        React.createElement('textarea', {
                            value: input,
                            onChange: (e) => setInput(e.target.value),
                            onKeyPress: handleKeyPress,
                            placeholder: 'Posez votre question à Copilot...',
                            className: 'flex-1 px-3 py-2 bg-gray-800 border border-gray-700 rounded-md text-white resize-none',
                            rows: 2,
                            disabled: loading
                        }),
                        React.createElement('button', {
                            onClick: sendMessage,
                            disabled: loading || !input.trim(),
                            className: 'btn-primary self-end px-6'
                        }, React.createElement(Send, { size: 20 }))
                    )
                )
            );
        }

        function CopilotPage() {
            const { user, token } = useAuth();
            const [copilotHealth, setCopilotHealth] = useState(null);

            useEffect(() => {
                if (!user) {
                    window.location.hash = '';
                    return;
                }

                const checkCopilotHealth = async () => {
                    try {
                        const response = await fetch('https://hubs-pro.onrender.com/api/copilot/health');
                        const data = await response.json();
                        setCopilotHealth(data);
                    } catch (error) {
                        console.error('Erreur vérification santé Copilot:', error);
                        setCopilotHealth({ online: false });
                    }
                };

                checkCopilotHealth();
            }, [user]);

            if (!user) return null;

            return React.createElement('div', { className: 'max-w-6xl mx-auto' },
                React.createElement('div', { className: 'flex items-center justify-between mb-8' },
                    React.createElement('div', null,
                        React.createElement('h1', { className: 'text-3xl font-bold text-white mb-2' }, 'Copilot IA'),
                        React.createElement('p', { className: 'text-gray-400' }, 'Assistant IA pour vous aider dans votre développement')
                    ),
                    copilotHealth && 
                        React.createElement('div', { 
                            className: `px-4 py-2 rounded-full ${
                                copilotHealth.online ? 'bg-green-500 text-white' : 'bg-red-500 text-white'
                            }` 
                        }, copilotHealth.online ? '🟢 En ligne' : '🔴 Hors ligne')
                ),

                React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-3 gap-8' },
                    React.createElement('div', { className: 'lg:col-span-2' },
                        React.createElement(CopilotChat, { token: token })
                    ),

                    React.createElement('div', { className: 'space-y-6' },
                        React.createElement('div', { className: 'github-card' },
                            React.createElement('h3', { className: 'text-lg font-semibold text-white mb-4' }, 'Actions rapides'),
                            React.createElement('div', { className: 'space-y-3' },
                                React.createElement('button', { className: 'w-full btn-secondary text-left p-3' },
                                    React.createElement(Code, { size: 16, className: 'inline mr-2' }),
                                    'Analyser du code'
                                ),
                                React.createElement('button', { className: 'w-full btn-secondary text-left p-3' },
                                    React.createElement(MessageSquare, { size: 16, className: 'inline mr-2' }),
                                    'Suggérer un commit'
                                )
                            )
                        ),

                        React.createElement('div', { className: 'github-card' },
                            React.createElement('h3', { className: 'text-lg font-semibold text-white mb-4' }, 'Statut Copilot'),
                            React.createElement('div', { className: 'space-y-2 text-sm' },
                                React.createElement('div', { className: 'flex justify-between' },
                                    React.createElement('span', { className: 'text-gray-400' }, 'Statut:'),
                                    React.createElement('span', { 
                                        className: copilotHealth?.online ? 'text-green-400' : 'text-red-400'
                                    }, copilotHealth?.online ? 'En ligne' : 'Hors ligne')
                                ),
                                React.createElement('div', { className: 'flex justify-between' },
                                    React.createElement('span', { className: 'text-gray-400' }, 'Version:'),
                                    React.createElement('span', { className: 'text-white' }, '12.0.0')
                                )
                            )
                        ),

                        React.createElement('div', { className: 'github-card' },
                            React.createElement('h3', { className: 'text-lg font-semibold text-white mb-4' }, 'Tips Copilot'),
                            React.createElement('ul', { className: 'text-sm text-gray-400 space-y-2' },
                                React.createElement('li', null, '• Soyez précis dans vos questions'),
                                React.createElement('li', null, '• Fournissez du contexte quand nécessaire'),
                                React.createElement('li', null, '• Utilisez "fr" pour des réponses en français'),
                                React.createElement('li', null, '• Testez l\'analyse de code pour du debugging')
                            )
                        )
                    )
                )
            );
        }

        // Pages supplémentaires (simplifiées)
        function ReleasesPage() {
            const { user } = useAuth();
            if (!user) return null;

            return React.createElement('div', { className: 'max-w-7xl mx-auto' },
                React.createElement('h1', { className: 'text-3xl font-bold text-white mb-8' }, 'Releases'),
                React.createElement('p', { className: 'text-gray-400' }, 'Page Releases en développement...')
            );
        }

        function WikiPage() {
            const { user } = useAuth();
            if (!user) return null;

            return React.createElement('div', { className: 'max-w-7xl mx-auto' },
                React.createElement('h1', { className: 'text-3xl font-bold text-white mb-8' }, 'Wiki'),
                React.createElement('p', { className: 'text-gray-400' }, 'Page Wiki en développement...')
            );
        }

        function AnalyticsPage() {
            const { user } = useAuth();
            if (!user) return null;

            return React.createElement('div', { className: 'max-w-7xl mx-auto' },
                React.createElement('h1', { className: 'text-3xl font-bold text-white mb-8' }, 'Analytics'),
                React.createElement('p', { className: 'text-gray-400' }, 'Page Analytics en développement...')
            );
        }

        // Router principal
        function App() {
            const [currentRoute, setCurrentRoute] = useState(window.location.hash.replace('#', '') || 'dashboard');

            useEffect(() => {
                const handleHashChange = () => {
                    setCurrentRoute(window.location.hash.replace('#', '') || 'dashboard');
                };

                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            let CurrentPage = HomePage;
            switch (currentRoute) {
                case 'dashboard':
                    CurrentPage = DashboardPage;
                    break;
                case 'repos':
                    CurrentPage = ReposPage;
                    break;
                case 'copilot':
                    CurrentPage = CopilotPage;
                    break;
                case 'releases':
                    CurrentPage = ReleasesPage;
                    break;
                case 'wiki':
                    CurrentPage = WikiPage;
                    break;
                case 'analytics':
                    CurrentPage = AnalyticsPage;
                    break;
                default:
                    CurrentPage = HomePage;
            }

            return React.createElement(AuthProvider, null,
                React.createElement(Layout, null,
                    React.createElement(CurrentPage)
                )
            );
        }

        // Rendu de l'application
        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
