<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>initHUB - Plateforme IA</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#7c3aed',
                        dark: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const API_BASE = 'https://hubs-ja2g.onrender.com/api';

        // Service API complet
        class ApiService {
            constructor() {
                this.token = localStorage.getItem('inithub_token');
            }

            async request(endpoint, options = {}) {
                const url = `${API_BASE}${endpoint}`;
                const config = {
                    headers: {
                        'Content-Type': 'application/json',
                        ...(this.token && { Authorization: `Bearer ${this.token}` }),
                        ...options.headers,
                    },
                    ...options,
                };

                try {
                    const response = await fetch(url, config);
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.detail || 'Erreur API');
                    }
                    
                    return data;
                } catch (error) {
                    console.error('API Error:', error);
                    throw error;
                }
            }

            // 🔐 AUTHENTIFICATION
            async login(email, password) {
                const data = await this.request('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password }),
                });
                this.token = data.access_token;
                localStorage.setItem('inithub_token', this.token);
                return data;
            }

            async register(userData) {
                return await this.request('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify(userData),
                });
            }

            async getCurrentUser() {
                return await this.request('/auth/me');
            }

            async updateProfile(profileData) {
                return await this.request('/auth/profile', {
                    method: 'PUT',
                    body: JSON.stringify(profileData),
                });
            }

            // 🧠 MODÈLES IA
            async createModel(modelData) {
                return await this.request('/models', {
                    method: 'POST',
                    body: JSON.stringify(modelData),
                });
            }

            async getModels(params = {}) {
                const query = new URLSearchParams(params).toString();
                return await this.request(`/models?${query}`);
            }

            async getModel(id) {
                return await this.request(`/models/${id}`);
            }

            async updateModel(id, modelData) {
                return await this.request(`/models/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify(modelData),
                });
            }

            async deleteModel(id) {
                return await this.request(`/models/${id}`, {
                    method: 'DELETE',
                });
            }

            // 📁 PROJETS
            async createProject(projectData) {
                return await this.request('/projects', {
                    method: 'POST',
                    body: JSON.stringify(projectData),
                });
            }

            async getProjects(params = {}) {
                const query = new URLSearchParams(params).toString();
                return await this.request(`/projects?${query}`);
            }

            async getProject(id) {
                return await this.request(`/projects/${id}`);
            }

            async updateProject(id, projectData) {
                return await this.request(`/projects/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify(projectData),
                });
            }

            async deleteProject(id) {
                return await this.request(`/projects/${id}`, {
                    method: 'DELETE',
                });
            }

            // 📤 FICHIERS
            async uploadFile(file, modelId = null, projectId = null, description = '') {
                const formData = new FormData();
                formData.append('file', file);
                if (modelId) formData.append('model_id', modelId);
                if (projectId) formData.append('project_id', projectId);
                if (description) formData.append('description', description);

                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    headers: {
                        Authorization: `Bearer ${this.token}`,
                    },
                    body: formData,
                });

                if (!response.ok) {
                    throw new Error('Upload failed');
                }

                return await response.json();
            }

            async getFiles(params = {}) {
                const query = new URLSearchParams(params).toString();
                return await this.request(`/files?${query}`);
            }

            async deleteFile(id) {
                return await this.request(`/files/${id}`, {
                    method: 'DELETE',
                });
            }

            // 🤖 IA & CODE
            async generateCode(prompt, language = 'python', maxLength = 200) {
                return await this.request('/ai/generate-code', {
                    method: 'POST',
                    body: JSON.stringify({ prompt, language, max_length: maxLength }),
                });
            }

            async explainCode(code) {
                const formData = new FormData();
                formData.append('code', code);
                
                const response = await fetch(`${API_BASE}/ai/explain-code`, {
                    method: 'POST',
                    headers: {
                        Authorization: `Bearer ${this.token}`,
                    },
                    body: formData,
                });
                return await response.json();
            }

            async detectBugs(code) {
                const formData = new FormData();
                formData.append('code', code);
                
                const response = await fetch(`${API_BASE}/ai/detect-bugs`, {
                    method: 'POST',
                    headers: {
                        Authorization: `Bearer ${this.token}`,
                    },
                    body: formData,
                });
                return await response.json();
            }

            // 💬 COMMENTAIRES & LIKES
            async createComment(commentData) {
                return await this.request('/comments', {
                    method: 'POST',
                    body: JSON.stringify(commentData),
                });
            }

            async getComments(params = {}) {
                const query = new URLSearchParams(params).toString();
                return await this.request(`/comments?${query}`);
            }

            async createLike(likeData) {
                return await this.request('/likes', {
                    method: 'POST',
                    body: JSON.stringify(likeData),
                });
            }

            async deleteLike(params = {}) {
                const query = new URLSearchParams(params).toString();
                return await this.request(`/likes?${query}`, {
                    method: 'DELETE',
                });
            }

            // 📊 STATISTIQUES
            async getStats() {
                return await this.request('/stats');
            }

            async getUserStats(userId) {
                return await this.request(`/stats/user/${userId}`);
            }

            async getPopularModels(limit = 10) {
                return await this.request(`/analytics/popular-models?limit=${limit}`);
            }

            async getRecentActivity(limit = 20) {
                return await this.request(`/analytics/recent-activity?limit=${limit}`);
            }

            // 🔍 RECHERCHE
            async search(query, searchType = 'all', limit = 20) {
                return await this.request(`/search?q=${encodeURIComponent(query)}&search_type=${searchType}&limit=${limit}`);
            }

            // 🏪 MARKETPLACE
            async createListing(listingData) {
                return await this.request('/marketplace/listings', {
                    method: 'POST',
                    body: JSON.stringify(listingData),
                });
            }

            async getListings(params = {}) {
                const query = new URLSearchParams(params).toString();
                return await this.request(`/marketplace/listings?${query}`);
            }

            // 📖 MARKDOWN
            async renderMarkdown(content, baseUrl = '') {
                const formData = new FormData();
                formData.append('content', content);
                formData.append('base_url', baseUrl);
                
                const response = await fetch(`${API_BASE}/markdown/render`, {
                    method: 'POST',
                    headers: {
                        Authorization: `Bearer ${this.token}`,
                    },
                    body: formData,
                });
                return await response.json();
            }

            // 🔧 SYSTÈME
            async getSystemInfo() {
                return await this.request('/system/info');
            }

            async getAdminUsers(skip = 0, limit = 50) {
                return await this.request(`/admin/users?skip=${skip}&limit=${limit}`);
            }

            logout() {
                this.token = null;
                localStorage.removeItem('inithub_token');
            }
        }

        // Contexte d'authentification
        const AuthContext = React.createContext();

        // Hook d'authentification
        function useAuth() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const api = new ApiService();

            React.useEffect(() => {
                checkAuth();
            }, []);

            const checkAuth = async () => {
                try {
                    const userData = await api.getCurrentUser();
                    setUser(userData);
                } catch (error) {
                    api.logout();
                } finally {
                    setLoading(false);
                }
            };

            const login = async (email, password) => {
                try {
                    await api.login(email, password);
                    const userData = await api.getCurrentUser();
                    setUser(userData);
                    return true;
                } catch (error) {
                    return false;
                }
            };

            const register = async (userData) => {
                try {
                    await api.register(userData);
                    return true;
                } catch (error) {
                    return false;
                }
            };

            const logout = () => {
                api.logout();
                setUser(null);
            };

            return { user, loading, login, register, logout, api };
        }

        // Composants d'icônes simples
        const Icon = ({ name, className = '' }) => {
            const icons = {
                brain: '🧠',
                code: '💻',
                upload: '📤',
                users: '👥',
                rocket: '🚀',
                login: '🔐',
                logout: '🚪',
                user: '👤',
                folder: '📁',
                cpu: '⚡',
                file: '📄',
                star: '⭐',
                search: '🔍',
                plus: '➕',
                trash: '🗑️',
                edit: '✏️',
                settings: '⚙️',
                chevron: '›'
            };
            
            return React.createElement('span', { className }, icons[name] || '•');
        };

        // Composant Header
        function Header() {
            const { user, logout } = React.useContext(AuthContext);
            const [mobileMenu, setMobileMenu] = React.useState(false);

            return React.createElement('header', { className: 'bg-white shadow-sm border-b' },
                React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8' },
                    React.createElement('div', { className: 'flex justify-between items-center h-16' },
                        // Logo
                        React.createElement('div', { className: 'flex items-center' },
                            React.createElement(Icon, { name: 'rocket', className: 'h-6 w-6 text-primary' }),
                            React.createElement('span', { className: 'ml-2 text-xl font-bold text-gray-900' }, 'initHUB')
                        ),

                        // Navigation Desktop
                        React.createElement('nav', { className: 'hidden md:flex items-center space-x-8' },
                            React.createElement('a', { href: '#dashboard', className: 'text-gray-700 hover:text-primary font-medium' }, 'Dashboard'),
                            React.createElement('a', { href: '#models', className: 'text-gray-700 hover:text-primary font-medium' }, 'Modèles IA'),
                            React.createElement('a', { href: '#projects', className: 'text-gray-700 hover:text-primary font-medium' }, 'Projets'),
                            React.createElement('a', { href: '#marketplace', className: 'text-gray-700 hover:text-primary font-medium' }, 'Marketplace'),
                            user && React.createElement('a', { 
                                href: '#upload', 
                                className: 'bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium flex items-center' 
                            },
                                React.createElement(Icon, { name: 'upload', className: 'h-4 w-4 mr-2' }),
                                'Upload'
                            )
                        ),

                        // Actions utilisateur
                        React.createElement('div', { className: 'hidden md:flex items-center space-x-4' },
                            user ? React.createElement(React.Fragment, null,
                                React.createElement('span', { className: 'text-gray-700' }, `👤 ${user.username}`),
                                React.createElement('button', { 
                                    onClick: logout,
                                    className: 'flex items-center text-gray-500 hover:text-red-600'
                                },
                                    React.createElement(Icon, { name: 'logout', className: 'h-4 w-4 mr-1' }),
                                    'Déconnexion'
                                )
                            ) : React.createElement(React.Fragment, null,
                                React.createElement('a', { href: '#login', className: 'text-gray-700 hover:text-primary font-medium' }, 'Connexion'),
                                React.createElement('a', { href: '#register', className: 'bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium' }, 'Inscription')
                            )
                        ),

                        // Menu mobile
                        React.createElement('button', {
                            onClick: () => setMobileMenu(!mobileMenu),
                            className: 'md:hidden text-gray-700'
                        }, '☰')
                    ),

                    // Menu mobile
                    mobileMenu && React.createElement('div', { className: 'md:hidden py-4 border-t' },
                        React.createElement('div', { className: 'flex flex-col space-y-4' },
                            React.createElement('a', { href: '#dashboard', className: 'text-gray-700 hover:text-primary' }, 'Dashboard'),
                            React.createElement('a', { href: '#models', className: 'text-gray-700 hover:text-primary' }, 'Modèles IA'),
                            React.createElement('a', { href: '#projects', className: 'text-gray-700 hover:text-primary' }, 'Projets'),
                            !user && React.createElement(React.Fragment, null,
                                React.createElement('a', { href: '#login', className: 'text-gray-700 hover:text-primary' }, 'Connexion'),
                                React.createElement('a', { href: '#register', className: 'text-gray-700 hover:text-primary' }, 'Inscription')
                            ),
                            user && React.createElement('button', { 
                                onClick: logout,
                                className: 'text-left text-gray-700 hover:text-red-600'
                            }, 'Déconnexion')
                        )
                    )
                )
            );
        }

        // Composant Dashboard
        function Dashboard() {
            const { user, api } = React.useContext(AuthContext);
            const [stats, setStats] = React.useState({});
            const [recentActivity, setRecentActivity] = React.useState([]);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                if (user) loadDashboardData();
            }, [user]);

            const loadDashboardData = async () => {
                try {
                    const [statsData, activityData] = await Promise.all([
                        api.getStats(),
                        api.getRecentActivity(5)
                    ]);
                    setStats(statsData);
                    setRecentActivity(activityData);
                } catch (error) {
                    console.error('Error loading dashboard:', error);
                } finally {
                    setLoading(false);
                }
            };

            if (!user) {
                return React.createElement('div', { className: 'text-center py-16' },
                    React.createElement('p', { className: 'text-gray-600' }, 'Veuillez vous connecter')
                );
            }

            if (loading) {
                return React.createElement('div', { className: 'flex justify-center py-16' },
                    React.createElement('div', { className: 'loading-spinner' })
                );
            }

            return React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8' },
                // En-tête
                React.createElement('div', { className: 'mb-8' },
                    React.createElement('h1', { className: 'text-3xl font-bold text-gray-900' }, 'Tableau de bord'),
                    React.createElement('p', { className: 'text-gray-600 mt-2' }, `Bon retour, ${user.username}!`)
                ),

                // Statistiques
                React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-4 gap-6 mb-8' },
                    React.createElement('div', { className: 'bg-white p-6 rounded-lg shadow border' },
                        React.createElement('div', { className: 'flex items-center' },
                            React.createElement(Icon, { name: 'users', className: 'text-2xl text-blue-500 mr-3' }),
                            React.createElement('div', null,
                                React.createElement('p', { className: 'text-sm text-gray-600' }, 'Utilisateurs'),
                                React.createElement('p', { className: 'text-2xl font-bold' }, stats.users || 0)
                            )
                        )
                    ),
                    React.createElement('div', { className: 'bg-white p-6 rounded-lg shadow border' },
                        React.createElement('div', { className: 'flex items-center' },
                            React.createElement(Icon, { name: 'cpu', className: 'text-2xl text-green-500 mr-3' }),
                            React.createElement('div', null,
                                React.createElement('p', { className: 'text-sm text-gray-600' }, 'Modèles IA'),
                                React.createElement('p', { className: 'text-2xl font-bold' }, stats.public_models || 0)
                            )
                        )
                    ),
                    React.createElement('div', { className: 'bg-white p-6 rounded-lg shadow border' },
                        React.createElement('div', { className: 'flex items-center' },
                            React.createElement(Icon, { name: 'folder', className: 'text-2xl text-purple-500 mr-3' }),
                            React.createElement('div', null,
                                React.createElement('p', { className: 'text-sm text-gray-600' }, 'Projets'),
                                React.createElement('p', { className: 'text-2xl font-bold' }, stats.public_projects || 0)
                            )
                        )
                    ),
                    React.createElement('div', { className: 'bg-white p-6 rounded-lg shadow border' },
                        React.createElement('div', { className: 'flex items-center' },
                            React.createElement(Icon, { name: 'star', className: 'text-2xl text-yellow-500 mr-3' }),
                            React.createElement('div', null,
                                React.createElement('p', { className: 'text-sm text-gray-600' }, 'Likes totaux'),
                                React.createElement('p', { className: 'text-2xl font-bold' }, stats.total_likes || 0)
                            )
                        )
                    )
                ),

                // Activité récente
                React.createElement('div', { className: 'bg-white rounded-lg shadow border p-6' },
                    React.createElement('h2', { className: 'text-xl font-bold mb-4' }, 'Activité récente'),
                    recentActivity.length > 0 ? 
                        React.createElement('div', { className: 'space-y-3' },
                            recentActivity.map(activity => 
                                React.createElement('div', { 
                                    key: activity.id,
                                    className: 'flex items-center justify-between p-3 border rounded'
                                },
                                    React.createElement('div', null,
                                        React.createElement('p', { className: 'font-medium' }, activity.name),
                                        React.createElement('p', { className: 'text-sm text-gray-600' }, 
                                            `${activity.type} par ${activity.author_username}`
                                        )
                                    ),
                                    React.createElement('p', { className: 'text-sm text-gray-500' },
                                        new Date(activity.created_at).toLocaleDateString()
                                    )
                                )
                            )
                        ) :
                        React.createElement('p', { className: 'text-gray-600 text-center py-4' }, 'Aucune activité récente')
                )
            );
        }

        // Composant Modèles IA
        function Models() {
            const { api } = React.useContext(AuthContext);
            const [models, setModels] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [search, setSearch] = React.useState('');

            React.useEffect(() => {
                loadModels();
            }, []);

            const loadModels = async () => {
                try {
                    const data = await api.getModels();
                    setModels(data);
                } catch (error) {
                    console.error('Error loading models:', error);
                } finally {
                    setLoading(false);
                }
            };

            const filteredModels = models.filter(model =>
                model.name.toLowerCase().includes(search.toLowerCase()) ||
                model.framework.toLowerCase().includes(search.toLowerCase()) ||
                model.task_type.toLowerCase().includes(search.toLowerCase())
            );

            return React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8' },
                // En-tête
                React.createElement('div', { className: 'mb-8' },
                    React.createElement('h1', { className: 'text-3xl font-bold text-gray-900 mb-4' }, 'Modèles IA'),
                    React.createElement('div', { className: 'flex flex-col sm:flex-row gap-4' },
                        React.createElement('div', { className: 'flex-1' },
                            React.createElement('input', {
                                type: 'text',
                                placeholder: 'Rechercher un modèle...',
                                value: search,
                                onChange: (e) => setSearch(e.target.value),
                                className: 'w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-primary'
                            })
                        ),
                        React.createElement('button', { 
                            className: 'bg-primary text-white px-6 py-2 rounded-lg hover:bg-blue-700 flex items-center'
                        },
                            React.createElement(Icon, { name: 'plus', className: 'mr-2' }),
                            'Nouveau modèle'
                        )
                    )
                ),

                // Liste des modèles
                loading ? 
                    React.createElement('div', { className: 'flex justify-center py-16' },
                        React.createElement('div', { className: 'loading-spinner' })
                    ) :
                    React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6' },
                        filteredModels.map(model => 
                            React.createElement('div', { 
                                key: model.id,
                                className: 'bg-white rounded-lg shadow border p-6 hover:shadow-md transition-shadow'
                            },
                                React.createElement('div', { className: 'flex justify-between items-start mb-4' },
                                    React.createElement('h3', { className: 'text-lg font-bold text-gray-900' }, model.name),
                                    React.createElement('span', { 
                                        className: `px-2 py-1 rounded text-xs font-medium ${
                                            model.is_public ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'
                                        }` 
                                    }, model.is_public ? 'Public' : 'Privé')
                                ),
                                React.createElement('p', { className: 'text-gray-600 mb-4 text-sm' }, 
                                    model.description || 'Aucune description'
                                ),
                                React.createElement('div', { className: 'flex flex-wrap gap-2 mb-4' },
                                    React.createElement('span', { 
                                        className: 'bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs'
                                    }, model.framework),
                                    React.createElement('span', { 
                                        className: 'bg-purple-100 text-purple-800 px-2 py-1 rounded text-xs'
                                    }, model.task_type)
                                ),
                                React.createElement('div', { className: 'flex justify-between items-center text-sm text-gray-500' },
                                    React.createElement('span', null, `v${model.version}`),
                                    React.createElement('span', null, `❤️ ${model.like_count || 0}`)
                                )
                            )
                        )
                    )
            );
        }

        // Composant Login
        function Login() {
            const { login } = React.useContext(AuthContext);
            const [form, setForm] = React.useState({ email: '', password: '' });
            const [loading, setLoading] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                const success = await login(form.email, form.password);
                setLoading(false);
                if (success) window.location.hash = 'dashboard';
            };

            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4' },
                React.createElement('div', { className: 'max-w-md w-full bg-white rounded-lg shadow-md p-8' },
                    React.createElement('h2', { className: 'text-2xl font-bold text-center mb-8' }, 'Connexion'),
                    React.createElement('form', { onSubmit: handleSubmit },
                        React.createElement('div', { className: 'mb-4' },
                            React.createElement('label', { className: 'block text-gray-700 mb-2' }, 'Email'),
                            React.createElement('input', {
                                type: 'email',
                                required: true,
                                value: form.email,
                                onChange: (e) => setForm({...form, email: e.target.value}),
                                className: 'w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary',
                                placeholder: 'votre@email.com'
                            })
                        ),
                        React.createElement('div', { className: 'mb-6' },
                            React.createElement('label', { className: 'block text-gray-700 mb-2' }, 'Mot de passe'),
                            React.createElement('input', {
                                type: 'password',
                                required: true,
                                value: form.password,
                                onChange: (e) => setForm({...form, password: e.target.value}),
                                className: 'w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary',
                                placeholder: 'Votre mot de passe'
                            })
                        ),
                        React.createElement('button', {
                            type: 'submit',
                            disabled: loading,
                            className: 'w-full bg-primary text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50 flex items-center justify-center'
                        },
                            loading && React.createElement('div', { className: 'loading-spinner mr-2' }),
                            'Se connecter'
                        )
                    ),
                    React.createElement('p', { className: 'text-center mt-4 text-gray-600' },
                        'Pas de compte? ',
                        React.createElement('a', { href: '#register', className: 'text-primary hover:underline' }, 'Inscrivez-vous')
                    )
                )
            );
        }

        // Composant Register
        function Register() {
            const { register } = React.useContext(AuthContext);
            const [form, setForm] = React.useState({
                username: '', email: '', password: '', full_name: ''
            });
            const [loading, setLoading] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                const success = await register(form);
                setLoading(false);
                if (success) window.location.hash = 'login';
            };

            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4' },
                React.createElement('div', { className: 'max-w-md w-full bg-white rounded-lg shadow-md p-8' },
                    React.createElement('h2', { className: 'text-2xl font-bold text-center mb-8' }, 'Inscription'),
                    React.createElement('form', { onSubmit: handleSubmit },
                        React.createElement('div', { className: 'mb-4' },
                            React.createElement('label', { className: 'block text-gray-700 mb-2' }, 'Nom d\'utilisateur'),
                            React.createElement('input', {
                                type: 'text',
                                required: true,
                                value: form.username,
                                onChange: (e) => setForm({...form, username: e.target.value}),
                                className: 'w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary',
                                placeholder: 'johndoe'
                            })
                        ),
                        React.createElement('div', { className: 'mb-4' },
                            React.createElement('label', { className: 'block text-gray-700 mb-2' }, 'Email'),
                            React.createElement('input', {
                                type: 'email',
                                required: true,
                                value: form.email,
                                onChange: (e) => setForm({...form, email: e.target.value}),
                                className: 'w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary',
                                placeholder: 'votre@email.com'
                            })
                        ),
                        React.createElement('div', { className: 'mb-4' },
                            React.createElement('label', { className: 'block text-gray-700 mb-2' }, 'Nom complet'),
                            React.createElement('input', {
                                type: 'text',
                                value: form.full_name,
                                onChange: (e) => setForm({...form, full_name: e.target.value}),
                                className: 'w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary',
                                placeholder: 'John Doe'
                            })
                        ),
                        React.createElement('div', { className: 'mb-6' },
                            React.createElement('label', { className: 'block text-gray-700 mb-2' }, 'Mot de passe'),
                            React.createElement('input', {
                                type: 'password',
                                required: true,
                                value: form.password,
                                onChange: (e) => setForm({...form, password: e.target.value}),
                                className: 'w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-primary',
                                placeholder: 'Mot de passe sécurisé'
                            })
                        ),
                        React.createElement('button', {
                            type: 'submit',
                            disabled: loading,
                            className: 'w-full bg-primary text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50 flex items-center justify-center'
                        },
                            loading && React.createElement('div', { className: 'loading-spinner mr-2' }),
                            'Créer mon compte'
                        )
                    ),
                    React.createElement('p', { className: 'text-center mt-4 text-gray-600' },
                        'Déjà un compte? ',
                        React.createElement('a', { href: '#login', className: 'text-primary hover:underline' }, 'Connectez-vous')
                    )
                )
            );
        }

        // Composant Home
        function Home() {
            return React.createElement('div', { className: 'min-h-screen' },
                // Hero Section
                React.createElement('section', { className: 'gradient-bg text-white py-20' },
                    React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center' },
                        React.createElement('h1', { className: 'text-5xl md:text-6xl font-bold mb-6' },
                            'initHUB ',
                            React.createElement('span', { className: 'text-yellow-300' }, 'IA')
                        ),
                        React.createElement('p', { className: 'text-xl md:text-2xl mb-8 text-blue-100' },
                            'Plateforme collaborative pour modèles et projets IA'
                        ),
                        React.createElement('div', { className: 'flex flex-col sm:flex-row gap-4 justify-center' },
                            React.createElement('a', { 
                                href: '#register',
                                className: 'bg-white text-primary px-8 py-4 rounded-lg font-bold text-lg hover:bg-gray-100'
                            }, 'Commencer gratuitement'),
                            React.createElement('a', { 
                                href: '#models',
                                className: 'border-2 border-white text-white px-8 py-4 rounded-lg font-bold text-lg hover:bg-white hover:text-primary'
                            }, 'Explorer les modèles')
                        )
                    )
                ),

                // Features Section
                React.createElement('section', { className: 'py-16 bg-white' },
                    React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8' },
                        React.createElement('h2', { className: 'text-3xl md:text-4xl font-bold text-center mb-12' }, 
                            'Pourquoi choisir initHUB?'
                        ),
                        React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-8' },
                            ['🧠 Modèles IA', '💻 Code Collaboratif', '🚀 Déploiement Simple'].map((feature, index) =>
                                React.createElement('div', { 
                                    key: index,
                                    className: 'text-center p-6'
                                },
                                    React.createElement('div', { className: 'text-4xl mb-4' }, feature.split(' ')[0]),
                                    React.createElement('h3', { className: 'text-xl font-bold mb-2' }, feature),
                                    React.createElement('p', { className: 'text-gray-600' }, 
                                        'Solution complète pour vos projets d\'intelligence artificielle'
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }

        // Router principal
        function App() {
            const auth = useAuth();
            const [currentView, setCurrentView] = React.useState('home');

            React.useEffect(() => {
                const handleHashChange = () => {
                    setCurrentView(window.location.hash.slice(1) || 'home');
                };

                window.addEventListener('hashchange', handleHashChange);
                handleHashChange();

                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            const renderView = () => {
                if (auth.loading) {
                    return React.createElement('div', { className: 'flex justify-center items-center min-h-screen' },
                        React.createElement('div', { className: 'loading-spinner' })
                    );
                }

                switch (currentView) {
                    case 'login': return React.createElement(Login);
                    case 'register': return React.createElement(Register);
                    case 'dashboard': return React.createElement(Dashboard);
                    case 'models': return React.createElement(Models);
                    default: return React.createElement(Home);
                }
            };

            return React.createElement(AuthContext.Provider, { value: auth },
                React.createElement('div', { className: 'min-h-screen flex flex-col' },
                    React.createElement(Header),
                    React.createElement('main', { className: 'flex-grow' }, renderView())
                )
            );
        }

        // Rendu
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
