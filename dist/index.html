    <script type="text/babel">
        // Configuration de l'API
        const API_BASE = 'https://hubs-ja2g.onrender.com/api';
        
        // Icônes Lucide
        const { 
            Brain, Code, Upload, Users, GitBranch, Rocket, 
            LogIn, UserPlus, LogOut, Menu, X, Search,
            FolderOpen, Cpu, FileText, Settings, Star,
            ChevronRight, Plus, Trash2, Edit3, Download

        // Contexte d'authentification
        const AuthContext = React.createContext();

        // Hook personnalisé pour l'authentification
        function useAuth() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                checkAuth();
            }, []);

            const checkAuth = async () => {
                try {
                    const token = localStorage.getItem('inithub_token');
                    if (token) {
                        const response = await axios.get(`${API_BASE}/auth/me`, {
                            headers: { Authorization: `Bearer ${token}` }
                        });
                        setUser(response.data);
                    }
                } catch (error) {
                    localStorage.removeItem('inithub_token');
                } finally {
                    setLoading(false);
                }
            };

            const login = async (email, password) => {
                try {
                    const response = await axios.post(`${API_BASE}/auth/login`, {
                        email, password
                    });
                    
                    const { access_token } = response.data;
                    localStorage.setItem('inithub_token', access_token);
                    
                    const userResponse = await axios.get(`${API_BASE}/auth/me`, {
                        headers: { Authorization: `Bearer ${access_token}` }
                    });
                    
                    setUser(userResponse.data);
                    reactHotToast.success('Connexion réussie!');
                    return true;
                } catch (error) {
                    reactHotToast.error('Erreur de connexion');
                    return false;
                }
            };

            const register = async (userData) => {
                try {
                    await axios.post(`${API_BASE}/auth/register`, userData);
                    reactHotToast.success('Compte créé avec succès!');
                    return true;
                } catch (error) {
                    reactHotToast.error('Erreur lors de la création du compte');
                    return false;
                }
            };

            const logout = () => {
                localStorage.removeItem('inithub_token');
                setUser(null);
                reactHotToast.success('Déconnexion réussie');
            };

            return { user, loading, login, register, logout };
        }

        // Composant Dashboard

            const { user } = React.useContext(AuthContext);
            const [stats, setStats] = React.useState({ projects: 0, models: 0, files: 0 });

                if (user) {
                    fetchDashboardData();
                }
            }, [user]);

            const fetchDashboardData = async () => {
                try {
                    const token = localStorage.getItem('inithub_token');
                    const [projectsRes, modelsRes] = await Promise.all([
                        axios.get(`${API_BASE}/projects`, {
                            headers: { Authorization: `Bearer ${token}` }
                        }),
                        axios.get(`${API_BASE}/models`, {
                            headers: { Authorization: `Bearer ${token}` }
                        })
                    ]);

                    setStats({
                        projects: projectsRes.data.length,
                        models: modelsRes.data.length,
                        files: projectsRes.data.reduce((acc, project) => acc + (project.files_count || 0), 0)
                    });

                    setRecentProjects(projectsRes.data.slice(0, 5));

                    console.error('Error fetching dashboard data:', error);

                                React.createElement('li', null, React.createElement('a', { href: '#tutorials', className: 'hover:text-white' }, 'Tutoriels')),

                )
            );
        }

        // Composant principal App
        function App() {
            const auth = useAuth();
            const [currentView, setCurrentView] = React.useState('home');

            // Gestion de la navigation par hash
            React.useEffect(() => {
                const handleHashChange = () => {
                    const hash = window.location.hash.slice(1) || 'home';
                    setCurrentView(hash);
                };

                window.addEventListener('hashchange', handleHashChange);
                handleHashChange(); // Initial call

                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            const renderCurrentView = () => {
                if (auth.loading) {
                    return React.createElement('div', { className: 'flex justify-center items-center min-h-screen' },
                        React.createElement('div', { className: 'loading-spinner' })
                    );
                }

                switch (currentView) {
                    case 'login':
                        return React.createElement(Login);
                    case 'register':
                        return React.createElement(Register);
                    case 'dashboard':
                        return React.createElement(Dashboard);
                    default:
                        return React.createElement(React.Fragment, null,
                            React.createElement(Hero),
                            React.createElement(Features),
                            !auth.user && React.createElement(React.Fragment, null,
                                React.createElement(Login),
                                React.createElement(Register)
                            )
                        );
                }
            };

            return React.createElement(AuthContext.Provider, { value: auth },
                React.createElement('div', { className: 'min-h-screen flex flex-col' },
                    React.createElement(Header),
                    React.createElement('main', { className: 'flex-grow' },
                        renderCurrentView()
                    ),
                    React.createElement(Footer),
                    // Container pour les toasts
                    React.createElement('div', { id: 'toast-container' })
                )
            );
        }

        // Rendu de l'application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
