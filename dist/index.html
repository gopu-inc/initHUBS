    <script type="text/babel">
        const API_BASE = 'https://hubs-ja2g.onrender.com/api';

        // Service API étendu
        class ApiService {
            constructor() {
                this.token = localStorage.getItem('inithub_token');
            }

            async request(endpoint, options = {}) {
                const url = `${API_BASE}${endpoint}`;
                const config = {
                    headers: {
                        'Content-Type': 'application/json',
                        ...(this.token && { Authorization: `Bearer ${this.token}` }),
                        ...options.headers,
                    },
                    ...options,
                };

                if (config.body && typeof config.body === 'object' && !(config.body instanceof FormData)) {
                    config.body = JSON.stringify(config.body);
                }

                try {
                    const response = await fetch(url, config);
                    
                    if (response.status === 204) {
                        return null;
                    }
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.detail || `Erreur ${response.status}`);
                    }
                    
                    return data;
                } catch (error) {
                    console.error('API Error:', error);
                    throw error;
                }
            }

            // 🔐 AUTHENTIFICATION AVANCÉE
            async login(email, password) {
                const data = await this.request('/auth/login', {
                    method: 'POST',
                    body: { email, password },
                });
                this.token = data.access_token;
                localStorage.setItem('inithub_token', this.token);
                localStorage.setItem('user_data', JSON.stringify(data.user));
                return data;
            }

            async register(userData) {
                return await this.request('/auth/register', {
                    method: 'POST',
                    body: userData,

                Object.keys(metadata).forEach(key => {

                const response = await fetch(`${API_BASE}/upload`, {

                    headers: {

                    body: formData,

                if (!response.ok) {

            }

            // 🏷️ GISTS
            async createGist(gistData) {

            logout() {
                this.token = null;
                localStorage.removeItem('inithub_token');
                localStorage.removeItem('user_data');
            }
        }

        // Contexte d'authentification
        const AuthContext = React.createContext();

        // Hook d'authentification avancé
        function useAuth() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [notifications, setNotifications] = React.useState([]);
            const api = new ApiService();

            React.useEffect(() => {
                checkAuth();
            }, []);

            const checkAuth = async () => {
                try {
                    const userData = await api.getCurrentUser();
                    setUser(userData);
                    
                    // Charger les notifications
                    const notifs = await api.getNotifications(0, 10);
                    setNotifications(notifs);
                } catch (error) {
                    api.logout();
                } finally {
                    setLoading(false);
                }
            };

            const login = async (email, password) => {
                try {
                    await api.login(email, password);
                    const userData = await api.getCurrentUser();
                    setUser(userData);
                    return true;
                } catch (error) {
                    return false;
                }
            };

            const register = async (userData) => {
                try {
                    await api.register(userData);
                    return true;
                } catch (error) {
                    return false;
                }
            };

            const logout = () => {
                api.logout();
                setUser(null);
                setNotifications([]);
            };

            const refreshNotifications = async () => {
                try {
                    const notifs = await api.getNotifications(0, 10);
                    setNotifications(notifs);
                } catch (error) {
                    console.error('Error refreshing notifications:', error);
                }
            };

            return { 
                user, 
                loading, 
                login, 
                register, 
                logout, 
                api,
                notifications,
                refreshNotifications
            };
        }

        // Composants d'icônes avec Lucide

                users: lucideReact.Users,

                logout: lucideReact.LogOut,
                user: lucideReact.User,
                folder: lucideReact.Folder,
                cpu: lucideReact.Cpu,
                file: lucideReact.File,
                star: lucideReact.Star,
                search: lucideReact.Search,
                plus: lucideReact.Plus,
                trash: lucideReact.Trash2,
                edit: lucideReact.Edit,
                settings: lucideReact.Settings,
                chevron: lucideReact.ChevronRight,
                bell: lucideReact.Bell,
                git: lucideReact.GitBranch,
                workflow: lucideReact.Workflow,
                badge: lucideReact.Award,
                sponsor: lucideReact.Heart,
                notebook: lucideReact.BookOpen,
                inference: lucideReact.Sparkles,
                trending: lucideReact.TrendingUp,
                marketplace: lucideReact.Store,
                admin: lucideReact.Shield
            };

            const IconComponent = icons[name];
            return IconComponent ? React.createElement(IconComponent, { 
                className, 
                size,
                ...props 
            }) : React.createElement('span', { className }, '•');
        };

        // Composant de notification
        function NotificationBell() {
            const { notifications, refreshNotifications } = React.useContext(AuthContext);
            const [showNotifications, setShowNotifications] = React.useState(false);
            const unreadCount = notifications.filter(n => !n.is_read).length;

            const handleMarkAsRead = async (notificationId) => {
                try {
                    await api.markNotificationRead(notificationId);
                    refreshNotifications();
                } catch (error) {
                    console.error('Error marking notification as read:', error);
                }
            };

            return React.createElement('div', { className: 'relative' },
                React.createElement('button', {
                    onClick: () => setShowNotifications(!showNotifications),
                    className: 'relative p-2 text-gray-600 hover:text-primary transition-colors'
                },
                    React.createElement(Icon, { name: 'bell', size: 20 }),
                    unreadCount > 0 && React.createElement('span', { 
                        className: 'notification-dot' 
                    })
                ),

                showNotifications && React.createElement('div', {
                    className: 'absolute right-0 top-12 w-80 bg-white rounded-lg shadow-lg border z-50 animate-slide-in'
                },
                    React.createElement('div', { className: 'p-4 border-b' },
                        React.createElement('h3', { className: 'font-semibold' }, 'Notifications'),
                        unreadCount > 0 && React.createElement('span', { 
                            className: 'ml-2 bg-primary text-white text-xs px-2 py-1 rounded-full' 
                        }, unreadCount)
                    ),
                    React.createElement('div', { className: 'max-h-96 overflow-y-auto' },
                        notifications.length > 0 ? notifications.map(notification => 
                            React.createElement('div', {
                                key: notification.id,
                                className: `p-4 border-b hover:bg-gray-50 cursor-pointer ${!notification.is_read ? 'bg-blue-50' : ''}`,
                                onClick: () => handleMarkAsRead(notification.id)
                            },
                                React.createElement('p', { className: 'font-medium text-sm' }, notification.title),
                                React.createElement('p', { className: 'text-gray-600 text-xs mt-1' }, notification.message),
                                React.createElement('p', { className: 'text-gray-400 text-xs mt-2' }, 
                                    new Date(notification.created_at).toLocaleDateString()
                                )
                            )
                        ) : React.createElement('div', { className: 'p-4 text-center text-gray-500' },
                            'Aucune notification'
                        )
                    )
                )
            );
        }

                                    },

                                )

                        ),

                        React.createElement('div', { className: 'flex items-center space-x-4' },

                            },

                                React.createElement('span', null, 'Upload')

                            user && React.createElement(NotificationBell),

                            // Menu utilisateur
                            user ? React.createElement('div', { className: 'relative' },
                                React.createElement('button', {
                                    onClick: () => setUserMenu(!userMenu),
                                    className: 'flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100 transition-colors'
                                },
                                    React.createElement('div', { className: 'w-8 h-8 bg-primary-600 rounded-full flex items-center justify-center' },

                                },

                                    React.createElement('h3', { className: 'text-lg font-bold text-gray-900 group-hover:text-primary-600 transition-colors' },

                                    ),
                                    React.createElement('span', { 
                                        className: 'px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs font-medium'
                                    }, notebook.language)
                                ),
                                React.createElement('p', { className: 'text-gray-600 mb-4 text-sm' }, 
                                    notebook.description || 'Aucune description'
                                ),
                                React.createElement('div', { className: 'flex justify-between items-center text-sm text-gray-500' },
                                    React.createElement('span', null,
                                        new Date(notebook.updated_at).toLocaleDateString()
                                    ),
                                    React.createElement('a', {
                                        href: `#notebooks/${notebook.id}`,
                                        className: 'text-primary-600 hover:text-primary-700 font-medium'
                                    }, 'Ouvrir →')
                                )
                            )
                        )
                    )
            );
        }

        // Composant Login (inchangé mais conservé pour la structure)
        function Login() {
            const { login } = React.useContext(AuthContext);
            const [form, setForm] = React.useState({ email: '', password: '' });
            const [loading, setLoading] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                const success = await login(form.email, form.password);
                setLoading(false);
                if (success) window.location.hash = 'dashboard';
            };

            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4' },
                React.createElement('div', { className: 'max-w-md w-full bg-white rounded-xl shadow-md p-8' },
                    React.createElement('h2', { className: 'text-2xl font-bold text-center mb-8' }, 'Connexion'),
                    React.createElement('form', { onSubmit: handleSubmit },
                        React.createElement('div', { className: 'mb-4' },
                            React.createElement('label', { className: 'block text-gray-700 mb-2 font-medium' }, 'Email'),
                            React.createElement('input', {
                                type: 'email',
                                required: true,
                                value: form.email,
                                onChange: (e) => setForm({...form, email: e.target.value}),
                                className: 'w-full px-3 py-3 border rounded-lg focus:outline-none focus:border-primary-500',
                                placeholder: 'votre@email.com'
                            })
                        ),
                        React.createElement('div', { className: 'mb-6' },
                            React.createElement('label', { className: 'block text-gray-700 mb-2 font-medium' }, 'Mot de passe'),
                            React.createElement('input', {
                                type: 'password',
                                required: true,
                                value: form.password,
                                onChange: (e) => setForm({...form, password: e.target.value}),
                                className: 'w-full px-3 py-3 border rounded-lg focus:outline-none focus:border-primary-500',
                                placeholder: 'Votre mot de passe'
                            })
                        ),
                        React.createElement('button', {
                            type: 'submit',
                            disabled: loading,
                            className: 'w-full bg-primary-600 text-white py-3 rounded-lg font-medium hover:bg-primary-700 disabled:opacity-50 flex items-center justify-center transition-colors'
                        },
                            loading && React.createElement('div', { className: 'loading-spinner mr-2' }),
                            'Se connecter'
                        )
                    ),
                    React.createElement('p', { className: 'text-center mt-4 text-gray-600' },
                        'Pas de compte? ',
                        React.createElement('a', { href: '#register', className: 'text-primary-600 hover:underline font-medium' }, 'Inscrivez-vous')
                    )
                )
            );
        }

        // Composant Home amélioré
        function Home() {
            return React.createElement('div', { className: 'min-h-screen' },
                // Hero Section
                React.createElement('section', { className: 'gradient-bg text-white py-20' },
                    React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center' },
                        React.createElement('h1', { className: 'text-5xl md:text-6xl font-bold mb-6' },
                            'initHUB ',
                            React.createElement('span', { className: 'text-yellow-300' }, 'IA')
                        ),
                        React.createElement('p', { className: 'text-xl md:text-2xl mb-8 text-blue-100' },
                            'Plateforme collaborative pour modèles et projets IA'
                        ),
                        React.createElement('div', { className: 'flex flex-col sm:flex-row gap-4 justify-center' },
                            React.createElement('a', { 
                                href: '#register',
                                className: 'bg-white text-primary-600 px-8 py-4 rounded-lg font-bold text-lg hover:bg-gray-100 transition-colors'
                            }, 'Commencer gratuitement'),
                            React.createElement('a', { 
                                href: '#models',
                                className: 'border-2 border-white text-white px-8 py-4 rounded-lg font-bold text-lg hover:bg-white hover:text-primary-600 transition-colors'
                            }, 'Explorer les modèles')
                        )
                    )
                ),

                // Features Section
                React.createElement('section', { className: 'py-16 bg-white' },
                    React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8' },
                        React.createElement('h2', { className: 'text-3xl md:text-4xl font-bold text-center mb-12' }, 
                            'Fonctionnalités principales'
                        ),
                        React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8' },
                            [
                                { 
                                    icon: 'brain', 
                                    title: 'Modèles IA', 
                                    description: 'Partagez et découvrez des modèles d\'IA entraînés' 
                                },
                                { 
                                    icon: 'git', 
                                    title: 'Git Intégré', 
                                    description: 'Gestion de versions avec système Git complet' 
                                },
                                { 
                                    icon: 'notebook', 
                                    title: 'Notebooks', 
                                    description: 'Environnement Jupyter intégré' 
                                },
                                { 
                                    icon: 'workflow', 
                                    title: 'Workflows', 
                                    description: 'Automatisez vos pipelines de données' 
                                },
                                { 
                                    icon: 'inference', 
                                    title: 'Inférence', 
                                    description: 'Exécutez des modèles en temps réel' 
                                },
                                { 
                                    icon: 'badge', 
                                    title: 'Badges', 
                                    description: 'Système de récompenses et achievements' 
                                },
                                { 
                                    icon: 'sponsor', 
                                    title: 'Sponsors', 
                                    description: 'Soutenez vos projets préférés' 
                                },
                                { 
                                    icon: 'marketplace', 
                                    title: 'Marketplace', 
                                    description: 'Échangez modèles et datasets' 
                                }
                            ].map((feature, index) =>
                                React.createElement('div', { 
                                    key: index,
                                    className: 'text-center p-6 hover:shadow-lg rounded-xl transition-shadow'
                                },
                                    React.createElement('div', { className: 'flex justify-center mb-4' },
                                        React.createElement(Icon, { name: feature.icon, size: 48, className: 'text-primary-600' })
                                    ),
                                    React.createElement('h3', { className: 'text-xl font-bold mb-2' }, feature.title),
                                    React.createElement('p', { className: 'text-gray-600' }, feature.description)
                                )
                            )
                        )
                    )
                )
            );
        }

        // Router principal étendu
        function App() {
            const auth = useAuth();
            const [currentView, setCurrentView] = React.useState('home');

            React.useEffect(() => {
                const handleHashChange = () => {
                    setCurrentView(window.location.hash.slice(1) || 'home');
                };

                window.addEventListener('hashchange', handleHashChange);
                handleHashChange();

                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            const renderView = () => {
                if (auth.loading) {
                    return React.createElement('div', { className: 'flex justify-center items-center min-h-screen' },
                        React.createElement('div', { className: 'loading-spinner' })
                    );
                }

                const views = {
                    'home': Home,
                    'login': Login,
                    'register': Login, // Utilisation temporaire du composant Login pour register
                    'dashboard': Dashboard,
                    'models': Models,
                    'projects': Models, // Temporaire
                    'git': GitRepositories,
                    'notebooks': Notebooks,
                    'marketplace': Models, // Temporaire
                    'trending': Models, // Temporaire
                    'workflows': GitRepositories, // Temporaire
                    'badges': GitRepositories // Temporaire
                };

                const ViewComponent = views[currentView] || Home;
                return React.createElement(ViewComponent);
            };

            return React.createElement(AuthContext.Provider, { value: auth },
                React.createElement('div', { className: 'min-h-screen flex flex-col' },
                    React.createElement(Header),
                    React.createElement('main', { className: 'flex-grow' }, renderView()),
                    // Footer
                    React.createElement('footer', { className: 'bg-dark text-white py-8' },
                        React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8' },
                            React.createElement('div', { className: 'flex flex-col md:flex-row justify-between items-center' },
                                React.createElement('div', { className: 'flex items-center space-x-2 mb-4 md:mb-0' },
                                    React.createElement(Icon, { name: 'rocket', className: 'h-6 w-6 text-primary-500' }),
                                    React.createElement('span', { className: 'text-xl font-bold' }, 'initHUB')
                                ),
                                React.createElement('p', { className: 'text-gray-400' }, 
                                    'Plateforme IA collaborative initHUBS gopu-inc docs complet git/initHUBS © 2025'
                                )
                            )
                        )
                    )
                )
            );
        }

        // Rendu
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
