<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>initHUB Cloud Enterprise</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --inithub-primary: #6366f1;
            --inithub-secondary: #8b5cf6;
            --inithub-accent: #06b6d4;
            --inithub-dark: #0f172a;
            --inithub-darker: #020617;
            --inithub-card: #1e293b;
            --inithub-border: #334155;
        }
        
        body { 
            background: linear-gradient(135deg, var(--inithub-darker) 0%, var(--inithub-dark) 100%);
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, var(--inithub-primary) 0%, var(--inithub-secondary) 50%, var(--inithub-accent) 100%);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, var(--inithub-primary) 0%, var(--inithub-secondary) 50%, var(--inithub-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--inithub-primary) 0%, var(--inithub-secondary) 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }
        
        .sidebar {
            width: 280px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            padding: 0.875rem 1rem;
            margin: 0.375rem 0;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            color: #94a3b8;
            font-weight: 500;
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, var(--inithub-primary) 0%, var(--inithub-secondary) 100%);
            color: white;
            box-shadow: 0 4px 15px -3px rgba(99, 102, 241, 0.3);
        }
        
        .nav-item:not(.active):hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            transform: translateX(4px);
        }
        
        .stats-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 1rem;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        
        .stats-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--inithub-primary) 0%, var(--inithub-secondary) 100%);
        }
        
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .floating-card {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .github-stats {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .repo-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .repo-card:hover {
            transform: translateY(-5px);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
        }

        .chat-message {
            max-width: 70%;
            padding: 1rem 1.25rem;
            border-radius: 1.25rem;
            margin: 0.5rem 0;
        }

        .chat-user {
            background: linear-gradient(135deg, var(--inithub-primary) 0%, var(--inithub-secondary) 100%);
            margin-left: auto;
        }

        .chat-bot {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useRef } = React;
        const { 
            Home, GitBranch, Bot, BarChart3, Download, BookOpen, 
            LogOut, User, Settings, Plus, Search, Star, GitFork, 
            Lock, Globe, Eye, Code, MessageSquare, Send,
            ChevronDown, Bell, Mail, TrendingUp, Users, Zap,
            GitPullRequest, GitCommit, GitMerge, Activity,
            FolderGit2, Server, Cloud, Database, Calendar,
            Clock, MessageCircle, GitCompare, Tag
        } = lucideReact;

        // Context d'authentification
        const AuthContext = createContext();

        function AuthProvider({ children }) {
            const [user, setUser] = useState(null);
            const [token, setToken] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const savedToken = localStorage.getItem('inithub_token');
                const savedUser = localStorage.getItem('inithub_user');
                
                if (savedToken && savedUser) {
                    setToken(savedToken);
                    setUser(JSON.parse(savedUser));
                }
                setLoading(false);
            }, []);

            const login = async (email, password) => {
                try {
                    const response = await fetch('https://hubs-pro.onrender.com/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email, password }),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || 'Erreur de connexion');
                    }

                    const data = await response.json();
                    
                    const tempUser = {
                        id: 1,
                        username: email.split('@')[0],
                        email: email,
                        full_name: 'Utilisateur initHUB',
                        avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(email.split('@')[0])}&background=6366f1&color=fff`
                    };
                    
                    localStorage.setItem('inithub_token', data.access_token);
                    localStorage.setItem('inithub_user', JSON.stringify(tempUser));
                    setToken(data.access_token);
                    setUser(tempUser);
                    
                    return { success: true };
                } catch (error) {
                    console.error('Erreur login:', error);
                    return { 
                        success: false, 
                        error: error.message 
                    };
                }
            };

            const register = async (userData) => {
                try {
                    const response = await fetch('https://hubs-pro.onrender.com/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(userData),
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || 'Erreur d\'inscription');
                    }

                    const data = await response.json();
                    
                    return { success: true, data };
                } catch (error) {
                    console.error('Erreur register:', error);
                    return { 
                        success: false, 
                        error: error.message 
                    };
                }
            };

            const logout = () => {
                localStorage.removeItem('inithub_token');
                localStorage.removeItem('inithub_user');
                setUser(null);
                setToken(null);
                window.location.hash = '';
            };

            return React.createElement(AuthContext.Provider, {
                value: {
                    user,
                    token,
                    loading,
                    login,
                    register,
                    logout
                }
            }, children);
        }

        function useAuth() {
            const context = useContext(AuthContext);
            if (!context) {
                throw new Error('useAuth must be used within AuthProvider');
            }
            return context;
        }

        // Composants UI
        function Logo() {
            return React.createElement('div', { 
                className: 'flex items-center gap-3 p-6 border-b border-gray-800'
            },
                React.createElement('img', {
                    src: 'https://github.com/gopu-inc/initHUBS/raw/main/logo.png',
                    alt: 'initHUB Logo',
                    className: 'w-10 h-10 rounded-xl'
                }),
                React.createElement('div', null,
                    React.createElement('div', { 
                        className: 'text-white font-bold text-xl gradient-text'
                    }, 'initHUB'),
                    React.createElement('div', { 
                        className: 'text-sm text-gray-400'
                    }, 'Cloud Enterprise')
                )
            );
        }

        function Header() {
            const { user, logout } = useAuth();

            if (!user) return null;

            return React.createElement('header', {
                className: 'bg-gray-900/80 backdrop-blur-lg border-b border-gray-800'
            }, 
                React.createElement('div', { className: 'max-w-7xl mx-auto px-6' },
                    React.createElement('div', { className: 'flex justify-between items-center h-20' },
                        React.createElement('div', { className: 'flex items-center' },
                            React.createElement('h1', { 
                                className: 'text-2xl font-bold gradient-text'
                            }, 'Tableau de Bord')
                        ),
                        React.createElement('div', { className: 'flex items-center space-x-4' },
                            React.createElement('button', { 
                                className: 'p-3 text-gray-400 hover:text-white transition-colors relative'
                            },
                                React.createElement(Bell, { size: 20 }),
                                React.createElement('span', {
                                    className: 'absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full pulse-dot'
                                })
                            ),
                            React.createElement('button', { 
                                className: 'p-3 text-gray-400 hover:text-white transition-colors relative'
                            },
                                React.createElement(Mail, { size: 20 }),
                                React.createElement('span', {
                                    className: 'absolute -top-1 -right-1 w-3 h-3 bg-blue-500 rounded-full pulse-dot'
                                })
                            ),
                            React.createElement('div', { 
                                className: 'flex items-center space-x-3 bg-gray-800/50 rounded-xl p-2'
                            },
                                React.createElement('img', {
                                    src: user.avatar,
                                    alt: user.username,
                                    className: 'w-8 h-8 rounded-full'
                                }),
                                React.createElement('div', { className: 'hidden sm:block' },
                                    React.createElement('div', { className: 'text-sm font-medium text-white' }, user.username),
                                    React.createElement('div', { className: 'text-xs text-gray-400' }, 'Développeur')
                                ),
                                React.createElement(ChevronDown, { size: 16, className: 'text-gray-400' })
                            ),
                            React.createElement('button', {
                                onClick: logout,
                                className: 'p-3 text-gray-400 hover:text-red-400 transition-colors',
                                title: 'Déconnexion'
                            }, React.createElement(LogOut, { size: 20 }))
                        )
                    )
                )
            );
        }

        function Sidebar() {
            const { user } = useAuth();
            const [currentRoute, setCurrentRoute] = useState(window.location.hash.replace('#', '') || 'dashboard');

            const navigation = [
                { name: 'Dashboard', href: 'dashboard', icon: Home, badge: null },
                { name: 'Repositories', href: 'repos', icon: GitBranch, badge: '12' },
                { name: 'Copilot', href: 'copilot', icon: Bot, badge: 'Nouveau' },
                { name: 'Releases', href: 'releases', icon: Download, badge: '3' },
                { name: 'Wiki', href: 'wiki', icon: BookOpen, badge: null },
                { name: 'Analytics', href: 'analytics', icon: BarChart3, badge: 'Pro' },
            ];

            if (!user) return null;

            return React.createElement('div', { className: 'sidebar min-h-screen' },
                React.createElement(Logo),
                React.createElement('nav', { className: 'p-4' },
                    React.createElement('ul', { className: 'space-y-2' },
                        navigation.map((item) => {
                            const Icon = item.icon;
                            const isActive = currentRoute === item.href;
                            
                            return React.createElement('li', { key: item.name },
                                React.createElement('button', {
                                    className: `nav-item w-full text-left ${isActive ? 'active' : ''}`,
                                    onClick: () => {
                                        setCurrentRoute(item.href);
                                        window.location.hash = item.href;
                                    }
                                },
                                    React.createElement(Icon, { size: 20, className: 'mr-3' }),
                                    item.name,
                                    item.badge && React.createElement('span', {
                                        className: `ml-auto px-2 py-1 text-xs rounded-full ${
                                            item.badge === 'Nouveau' ? 'bg-green-500/20 text-green-400' :
                                            item.badge === 'Pro' ? 'gradient-bg text-white' :
                                            'bg-gray-700 text-gray-300'
                                        }`
                                    }, item.badge)
                                )
                            );
                        })
                    )
                ),
                React.createElement('div', { className: 'p-4 border-t border-gray-800 mt-8' },
                    React.createElement('div', { className: 'glass-card p-4 rounded-xl' },
                        React.createElement('div', { className: 'flex items-center space-x-3' },
                            React.createElement(Zap, { size: 20, className: 'text-yellow-400' }),
                            React.createElement('div', null,
                                React.createElement('div', { className: 'text-sm font-medium text-white' }, 'initHUB Pro'),
                                React.createElement('div', { className: 'text-xs text-gray-400' }, 'Débloquez toutes les fonctionnalités')
                            )
                        ),
                        React.createElement('button', {
                            className: 'btn-primary w-full mt-3 text-sm py-2'
                        }, 'Mettre à niveau')
                    )
                )
            );
        }

        function Layout({ children }) {
            const { user } = useAuth();

            if (!user) {
                return children;
            }

            return React.createElement('div', { className: 'flex' },
                React.createElement(Sidebar),
                React.createElement('div', { className: 'flex-1 flex flex-col min-h-screen' },
                    React.createElement(Header),
                    React.createElement('main', { className: 'flex-1 p-6' }, children)
                )
            );
        }

        // Composants de Graphiques
        function ActivityChart() {
            const chartRef = useRef(null);

            useEffect(() => {
                if (chartRef.current) {
                    const ctx = chartRef.current.getContext('2d');
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
                            datasets: [{
                                label: 'Commits',
                                data: [12, 19, 8, 15, 22, 18, 25],
                                borderColor: '#6366f1',
                                backgroundColor: 'rgba(99, 102, 241, 0.1)',
                                tension: 0.4,
                                fill: true
                            }, {
                                label: 'Pull Requests',
                                data: [5, 8, 12, 6, 15, 10, 8],
                                borderColor: '#8b5cf6',
                                backgroundColor: 'rgba(139, 92, 246, 0.1)',
                                tension: 0.4,
                                fill: true
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'top',
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    grid: {
                                        color: 'rgba(255, 255, 255, 0.1)'
                                    }
                                },
                                x: {
                                    grid: {
                                        color: 'rgba(255, 255, 255, 0.1)'
                                    }
                                }
                            }
                        }
                    });
                }
            }, []);

            return React.createElement('div', { className: 'glass-card p-6' },
                React.createElement('div', { className: 'flex items-center justify-between mb-6' },
                    React.createElement('h3', { className: 'text-lg font-semibold text-white' }, 'Activité Hebdomadaire'),
                    React.createElement(TrendingUp, { size: 20, className: 'text-green-400' })
                ),
                React.createElement('canvas', { ref: chartRef, height: '300' })
            );
        }

        function LanguageChart() {
            const chartRef = useRef(null);

            useEffect(() => {
                if (chartRef.current) {
                    new Chart(chartRef.current, {
                        type: 'doughnut',
                        data: {
                            labels: ['JavaScript', 'Python', 'TypeScript', 'HTML', 'CSS', 'Autres'],
                            datasets: [{
                                data: [35, 25, 20, 10, 5, 5],
                                backgroundColor: [
                                    '#6366f1',
                                    '#8b5cf6',
                                    '#06b6d4',
                                    '#10b981',
                                    '#f59e0b',
                                    '#6b7280'
                                ],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            cutout: '70%',
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                }
                            }
                        }
                    });
                }
            }, []);

            return React.createElement('div', { className: 'glass-card p-6' },
                React.createElement('h3', { className: 'text-lg font-semibold text-white mb-6' }, 'Langages Utilisés'),
                React.createElement('div', { className: 'flex justify-center' },
                    React.createElement('canvas', { ref: chartRef, width: '250', height: '250' })
                )
            );
        }

        function StatsCard({ title, value, icon, description, trend }) {
            return React.createElement('div', { className: 'stats-card' },
                React.createElement('div', { className: 'flex items-start justify-between' },
                    React.createElement('div', null,
                        React.createElement('p', { className: 'text-gray-400 text-sm font-medium mb-2' }, title),
                        React.createElement('p', { className: 'text-3xl font-bold text-white mb-1' }, value),
                        React.createElement('p', { className: 'text-gray-500 text-sm' }, description)
                    ),
                    React.createElement('div', { className: 'p-3 rounded-xl bg-white/5' }, icon)
                ),
                trend && React.createElement('div', { 
                    className: `flex items-center mt-3 text-sm ${
                        trend > 0 ? 'text-green-400' : 'text-red-400'
                    }` 
                },
                    React.createElement(TrendingUp, { size: 16, className: 'mr-1' }),
                    `${Math.abs(trend)}% ${trend > 0 ? 'augmentation' : 'diminution'}`
                )
            );
        }

        // Pages
        function HomePage() {
            const [isLogin, setIsLogin] = useState(true);
            const [formData, setFormData] = useState({
                email: '',
                password: '',
                username: '',
                full_name: ''
            });
            const [message, setMessage] = useState('');
            const { user, login, register, loading } = useAuth();

            useEffect(() => {
                if (user) {
                    window.location.hash = 'dashboard';
                }
            }, [user]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setMessage('');
                
                let result;
                if (isLogin) {
                    result = await login(formData.email, formData.password);
                } else {
                    result = await register(formData);
                }
                
                if (result.success) {
                    setMessage('✅ Connexion réussie! Redirection...');
                } else {
                    setMessage(`❌ ${result.error}`);
                }
            };

            if (user) {
                return React.createElement('div', {
                    className: 'min-h-screen flex items-center justify-center'
                },
                    React.createElement('div', { className: 'text-center' },
                        React.createElement('div', { className: 'animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto' }),
                        React.createElement('p', { className: 'text-gray-400 mt-4' }, 'Redirection...')
                    )
                );
            }

            const features = [
                {
                    icon: React.createElement(Server, { size: 32 }),
                    title: 'Git Enterprise',
                    description: 'Hébergement Git haute performance avec LFS et CI/CD intégré'
                },
                {
                    icon: React.createElement(Bot, { size: 32 }),
                    title: 'Copilot IA Avancé',
                    description: 'Assistant IA contextuel pour le développement full-stack'
                },
                {
                    icon: React.createElement(BarChart3, { size: 32 }),
                    title: 'Analytics Temps Réel',
                    description: 'Métriques avancées et tableaux de bord interactifs'
                },
                {
                    icon: React.createElement(Cloud, { size: 32 }),
                    title: 'Cloud Native',
                    description: 'Infrastructure scalable avec déploiement automatique'
                },
                {
                    icon: React.createElement(Database, { size: 32 }),
                    title: 'Data Insights',
                    description: 'Analyse approfondie de vos données de développement'
                },
                {
                    icon: React.createElement(Users, { size: 32 }),
                    title: 'Team Collaboration',
                    description: 'Outils de collaboration avancés pour les équipes'
                }
            ];

            return React.createElement('div', { className: 'min-h-screen' },
                React.createElement('div', { className: 'absolute inset-0 -z-10' },
                    React.createElement('div', { 
                        className: 'absolute inset-0 bg-gradient-to-br from-purple-900/20 via-blue-900/20 to-cyan-900/20'
                    })
                ),
                React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8' },
                    React.createElement('div', { className: 'pt-16 pb-20 text-center' },
                        React.createElement('div', { className: 'flex items-center justify-center mb-8 floating-card' },
                            React.createElement('img', {
                                src: 'https://github.com/gopu-inc/initHUBS/raw/main/logo.png',
                                alt: 'initHUB Logo',
                                className: 'w-20 h-20 rounded-2xl mr-6'
                            }),
                            React.createElement('div', { className: 'text-left' },
                                React.createElement('h1', { 
                                    className: 'text-6xl font-bold gradient-text mb-2'
                                }, 'initHUB'),
                                React.createElement('p', { 
                                    className: 'text-2xl text-gray-300'
                                }, 'Cloud Enterprise')
                            )
                        ),
                        React.createElement('p', { 
                            className: 'text-xl text-gray-400 max-w-3xl mx-auto mb-12'
                        }, 'Plateforme de développement cloud nouvelle génération avec IA intégrée, analytics avancés et collaboration d\'équipe')
                    ),

                    React.createElement('div', { className: 'grid grid-cols-1 xl:grid-cols-2 gap-12 mb-20' },
                        React.createElement('div', { className: 'glass-card p-8 rounded-2xl' },
                            React.createElement('h2', { 
                                className: 'text-3xl font-bold gradient-text mb-2'
                            }, isLogin ? 'Connexion' : 'Rejoindre initHUB'),
                            React.createElement('p', { 
                                className: 'text-gray-400 mb-8'
                            }, isLogin ? 'Accédez à votre espace de développement' : 'Créez votre compte et commencez à développer'),
                            
                            message && React.createElement('div', {

        function CopilotChat({ token }) {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
                }
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const sendMessage = async () => {
                if (!input.trim() || loading) return;

                const userMessage = {
                    id: Date.now(),
                    type: 'user',
                    content: input,
                    timestamp: new Date()
                };

                setMessages(prev => [...prev, userMessage]);
                setInput('');
                setLoading(true);

                try {
                    const response = await fetch('https://hubs-pro.onrender.com/api/copilot/ask', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            question: input,
                            language: 'fr'
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Erreur API Copilot');
                    }

                    const data = await response.json();

                    const botMessage = {
                        id: Date.now() + 1,
                        type: 'bot',
                        content: data.response,
                        timestamp: new Date()
                    };

                    setMessages(prev => [...prev, botMessage]);
                } catch (error) {
                    console.error('Erreur Copilot:', error);
                    
                    const errorMessage = {
                        id: Date.now() + 1,
                        type: 'bot',
                        content: 'Désolé, une erreur est survenue. Veuillez réessayer.',
                        timestamp: new Date()
                    };
                    
                    setMessages(prev => [...prev, errorMessage]);
                } finally {
                    setLoading(false);
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            const quickActions = [
                {
                    icon: React.createElement(Code, { size: 16 }),
                    text: 'Analyser ce code',
                    prompt: 'Peux-tu analyser ce code pour optimiser les performances ?'
                },
                {
                    icon: React.createElement(MessageSquare, { size: 16 }),
                    text: 'Suggérer un commit',
                    prompt: 'Génère un message de commit pour ces modifications'
                },
                {
                    icon: React.createElement(GitCompare, { size: 16 }),
                    text: 'Review la PR',
                    prompt: 'Peux-tu review cette pull request ?'
                }
            ];

            return React.createElement('div', { className: 'flex flex-col h-[600px] glass-card' },
                React.createElement('div', { className: 'flex-1 overflow-y-auto p-6 space-y-4' },
                    messages.length === 0 && 
                        React.createElement('div', { className: 'text-center py-12' },
                            React.createElement(Bot, { size: 64, className: 'text-blue-400 mx-auto mb-4' }),
                            React.createElement('h3', { className: 'text-2xl font-bold text-white mb-2' }, 'initHUB Copilot'),
                            React.createElement('p', { className: 'text-gray-400 mb-6' }, 'Votre assistant IA pour le développement'),
                            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-3 max-w-2xl mx-auto' },
                                quickActions.map((action, index) =>
                                    React.createElement('button', {
                                        key: index,
                                        className: 'btn-secondary text-left p-3 text-sm',
                                        onClick: () => setInput(action.prompt)
                                    },
                                        action.icon,

        // Router principal
        function App() {
            const [currentRoute, setCurrentRoute] = useState(window.location.hash.replace('#', '') || 'dashboard');

            useEffect(() => {
                const handleHashChange = () => {
                    setCurrentRoute(window.location.hash.replace('#', '') || 'dashboard');
                };

                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            let CurrentPage = HomePage;
            switch (currentRoute) {
                case 'dashboard':
                    CurrentPage = DashboardPage;
                    break;
                case 'repos':
                    CurrentPage = ReposPage;
                    break;
                case 'copilot':
                    CurrentPage = CopilotPage;
                    break;
                case 'releases':
                    CurrentPage = ReleasesPage;
                    break;
                case 'wiki':
                    CurrentPage = WikiPage;
                    break;
                case 'analytics':
                    CurrentPage = AnalyticsPage;
                    break;
                default:
                    CurrentPage = HomePage;
            }

            return React.createElement(AuthProvider, null,
                React.createElement(Layout, null,
                    React.createElement(CurrentPage)
                )
            );
        }
