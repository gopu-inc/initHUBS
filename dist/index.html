<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>initHUB Cloud Enterprise</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --inithub-primary: #6366f1;
            --inithub-secondary: #8b5cf6;
            --inithub-accent: #06b6d4;
            --inithub-dark: #0f172a;
            --inithub-darker: #020617;
        }
        
        body { 
            background: linear-gradient(135deg, var(--inithub-darker) 0%, var(--inithub-dark) 100%);
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, var(--inithub-primary) 0%, var(--inithub-secondary) 100%);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, var(--inithub-primary) 0%, var(--inithub-secondary) 50%, var(--inithub-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--inithub-primary) 0%, var(--inithub-secondary) 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            padding: 0.875rem 1rem;
            margin: 0.375rem 0;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            color: #94a3b8;
            font-weight: 500;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, var(--inithub-primary) 0%, var(--inithub-secondary) 100%);
            color: white;
            box-shadow: 0 4px 15px -3px rgba(99, 102, 241, 0.3);
        }
        
        .nav-item:not(.active):hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            transform: translateX(4px);
        }
        
        .stats-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 1rem;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        
        .stats-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--inithub-primary) 0%, var(--inithub-secondary) 100%);
        }
        
        .repo-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .repo-card:hover {
            transform: translateY(-5px);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
        }

        .chat-message {
            max-width: 70%;
            padding: 1rem 1.25rem;
            border-radius: 1.25rem;
            margin: 0.5rem 0;
        }

        .chat-user {
            background: linear-gradient(135deg, var(--inithub-primary) 0%, var(--inithub-secondary) 100%);
            margin-left: auto;
        }

        .chat-bot {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        input, textarea, select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: white;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--inithub-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .pulse-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useRef } = React;

        // Icônes simulées (puisque lucide-react ne charge pas)
        const createIcon = (name) => {
            const icons = {
                Home: '🏠',
                GitBranch: '📚',
                Bot: '🤖',
                BarChart3: '📊',
                Download: '📥',
                BookOpen: '📖',
                LogOut: '🚪',
                User: '👤',
                Settings: '⚙️',
                Plus: '➕',
                Search: '🔍',
                Star: '⭐',
                GitFork: '🔀',
                Lock: '🔒',
                Globe: '🌐',
                Eye: '👁️',
                Code: '💻',
                MessageSquare: '💬',
                Send: '📤',
                ChevronDown: '⬇️',
                Bell: '🔔',
                Mail: '📧',
                TrendingUp: '📈',
                Users: '👥',
                Zap: '⚡',
                GitPullRequest: '🔄',
                GitCommit: '💾',
                GitMerge: '🔄',
                Activity: '📈',
                FolderGit2: '📁',
                Server: '🖥️',
                Cloud: '☁️',
                Database: '💾',
                Calendar: '📅',
                Clock: '⏰',
                Tag: '🏷️'
            };
            return icons[name] || '🔹';
        };

        // Context d'authentification
        const AuthContext = createContext();

        function AuthProvider({ children }) {
            const [user, setUser] = useState(null);
            const [token, setToken] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const savedToken = localStorage.getItem('inithub_token');
                const savedUser = localStorage.getItem('inithub_user');
                
                if (savedToken && savedUser) {
                    setToken(savedToken);
                    setUser(JSON.parse(savedUser));
                }
                setLoading(false);
            }, []);

            const login = async (email, password) => {
                try {
                    console.log('Tentative de connexion avec:', email);
                    const response = await fetch('https://hubs-pro.onrender.com/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email, password }),
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(errorText || 'Erreur de connexion');
                    }

                    const data = await response.json();
                    console.log('Réponse login:', data);
                    
                    const tempUser = {
                        id: 1,
                        username: email.split('@')[0],
                        email: email,
                        full_name: 'Utilisateur initHUB',
                        avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(email.split('@')[0])}&background=6366f1&color=fff`
                    };
                    
                    localStorage.setItem('inithub_token', data.access_token);
                    localStorage.setItem('inithub_user', JSON.stringify(tempUser));
                    setToken(data.access_token);
                    setUser(tempUser);
                    
                    return { success: true };
                } catch (error) {
                    console.error('Erreur login:', error);
                    return { 
                        success: false, 
                        error: error.message 
                    };
                }
            };

            const register = async (userData) => {
                try {
                    console.log('Tentative d\'inscription avec:', userData);
                    const response = await fetch('https://hubs-pro.onrender.com/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(userData),
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(errorText || 'Erreur d\'inscription');
                    }

                    const data = await response.json();
                    console.log('Réponse register:', data);
                    
                    return { success: true, data };
                } catch (error) {
                    console.error('Erreur register:', error);
                    return { 
                        success: false, 
                        error: error.message 
                    };
                }
            };

            const logout = () => {
                localStorage.removeItem('inithub_token');
                localStorage.removeItem('inithub_user');
                setUser(null);
                setToken(null);
                window.location.hash = '';
            };

            return React.createElement(AuthContext.Provider, {
                value: {
                    user,
                    token,
                    loading,
                    login,
                    register,
                    logout
                }
            }, children);
        }

        function useAuth() {
            const context = useContext(AuthContext);
            if (!context) {
                throw new Error('useAuth must be used within AuthProvider');
            }
            return context;
        }

        // Composants UI
        function Logo() {
            return React.createElement('div', { 
                className: 'flex items-center gap-3 p-6 border-b border-gray-800'
            },
                React.createElement('div', { 
                    className: 'w-10 h-10 rounded-xl gradient-bg flex items-center justify-center text-white font-bold'
                }, 'IH'),
                React.createElement('div', null,
                    React.createElement('div', { 
                        className: 'text-white font-bold text-xl'
                    }, 'initHUB'),
                    React.createElement('div', { 
                        className: 'text-sm text-gray-400'
                    }, 'Cloud Enterprise')
                )
            );
        }

        function Header() {
            const { user, logout } = useAuth();

            if (!user) return null;

            return React.createElement('header', {
                className: 'bg-gray-900/80 border-b border-gray-800 p-4'
            }, 
                React.createElement('div', { className: 'flex justify-between items-center' },
                    React.createElement('div', { className: 'flex items-center' },
                        React.createElement('h1', { 
                            className: 'text-xl font-bold text-white'
                        }, 'Tableau de Bord')
                    ),
                    React.createElement('div', { className: 'flex items-center space-x-4' },
                        React.createElement('button', { 
                            className: 'p-2 text-gray-400 hover:text-white transition-colors'
                        }, createIcon('Bell')),
                        React.createElement('div', { 
                            className: 'flex items-center space-x-3 bg-gray-800/50 rounded-xl p-2'
                        },
                            React.createElement('div', { 
                                className: 'w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white text-sm font-bold'
                            }, user.username ? user.username.charAt(0).toUpperCase() : 'U'),
                            React.createElement('div', { className: 'hidden sm:block' },
                                React.createElement('div', { className: 'text-sm font-medium text-white' }, user.username),
                                React.createElement('div', { className: 'text-xs text-gray-400' }, 'Développeur')
                            )
                        ),
                        React.createElement('button', {
                            onClick: logout,
                            className: 'p-2 text-gray-400 hover:text-red-400 transition-colors',
                            title: 'Déconnexion'
                        }, createIcon('LogOut'))
                    )
                )
            );
        }

        function Sidebar() {
            const { user } = useAuth();
            const [currentRoute, setCurrentRoute] = useState(window.location.hash.replace('#', '') || 'dashboard');

            const navigation = [
                { name: 'Dashboard', href: 'dashboard', icon: 'Home' },
                { name: 'Repositories', href: 'repos', icon: 'GitBranch' },
                { name: 'Copilot', href: 'copilot', icon: 'Bot' },
                { name: 'Releases', href: 'releases', icon: 'Download' },
                { name: 'Wiki', href: 'wiki', icon: 'BookOpen' },
                { name: 'Analytics', href: 'analytics', icon: 'BarChart3' },
            ];

            if (!user) return null;

            return React.createElement('div', { className: 'w-64 bg-gray-900 min-h-screen border-r border-gray-800' },
                React.createElement(Logo),
                React.createElement('nav', { className: 'p-4' },
                    React.createElement('div', { className: 'space-y-2' },
                        navigation.map((item) => {
                            const isActive = currentRoute === item.href;
                            
                            return React.createElement('button', {
                                key: item.name,
                                className: `nav-item ${isActive ? 'active' : ''}`,
                                onClick: () => {
                                    setCurrentRoute(item.href);
                                    window.location.hash = item.href;
                                }
                            },
                                React.createElement('span', { className: 'mr-3' }, createIcon(item.icon)),
                                item.name
                            );
                        })
                    )
                )
            );
        }

        function Layout({ children }) {
            const { user } = useAuth();

            if (!user) {
                return children;
            }

            return React.createElement('div', { className: 'flex min-h-screen' },
                React.createElement(Sidebar),
                React.createElement('div', { className: 'flex-1 flex flex-col' },
                    React.createElement(Header),
                    React.createElement('main', { className: 'flex-1 p-6' }, children)
                )
            );
        }

        // Composant de statistiques
        function StatsCard({ title, value, description, trend }) {
            return React.createElement('div', { className: 'stats-card' },
                React.createElement('div', { className: 'flex items-start justify-between' },
                    React.createElement('div', null,
                        React.createElement('p', { className: 'text-gray-400 text-sm font-medium mb-2' }, title),
                        React.createElement('p', { className: 'text-3xl font-bold text-white mb-1' }, value),
                        React.createElement('p', { className: 'text-gray-500 text-sm' }, description)
                    ),
                    trend && React.createElement('div', { 
                        className: `flex items-center text-sm ${
                            trend > 0 ? 'text-green-400' : 'text-red-400'
                        }` 
                    },
                        createIcon('TrendingUp'),
                        `${Math.abs(trend)}%`
                    )
                )
            );
        }

        // Pages
        function HomePage() {
            const [isLogin, setIsLogin] = useState(true);
            const [formData, setFormData] = useState({
                email: 'test@example.com',
                password: 'password',
                username: 'testuser',
                full_name: 'Test User'
            });
            const [message, setMessage] = useState('');
            const { user, login, register, loading } = useAuth();

            useEffect(() => {
                if (user) {
                    window.location.hash = 'dashboard';
                }
            }, [user]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setMessage('');
                
                let result;
                if (isLogin) {
                    result = await login(formData.email, formData.password);
                } else {
                    result = await register(formData);
                }
                
                if (result.success) {
                    setMessage('✅ Connexion réussie! Redirection...');
                } else {
                    setMessage(`❌ ${result.error}`);
                }
            };

            if (user) {
                return React.createElement('div', {
                    className: 'min-h-screen flex items-center justify-center'
                },
                    React.createElement('div', { className: 'text-center' },
                        React.createElement('div', { className: 'animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto' }),
                        React.createElement('p', { className: 'text-gray-400 mt-4' }, 'Redirection...')
                    )
                );
            }

            const features = [
                {
                    icon: createIcon('Server'),
                    title: 'Git Enterprise',
                    description: 'Hébergement Git haute performance'
                },
                {
                    icon: createIcon('Bot'),
                    title: 'Copilot IA',
                    description: 'Assistant IA pour le développement'
                },
                {
                    icon: createIcon('BarChart3'),
                    title: 'Analytics',
                    description: 'Métriques et tableaux de bord'
                }
            ];

            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center p-4' },
                React.createElement('div', { className: 'max-w-4xl w-full' },
                    React.createElement('div', { className: 'text-center mb-12' },
                        React.createElement('div', { className: 'flex items-center justify-center mb-6' },
                            React.createElement('div', { 
                                className: 'w-16 h-16 rounded-2xl gradient-bg flex items-center justify-center text-white font-bold text-2xl mr-4'
                            }, 'IH'),
                            React.createElement('div', { className: 'text-left' },
                                React.createElement('h1', { 
                                    className: 'text-5xl font-bold gradient-text mb-2'
                                }, 'initHUB'),
                                React.createElement('p', { 
                                    className: 'text-xl text-gray-300'
                                }, 'Cloud Enterprise')
                            )
                        ),
                        React.createElement('p', { 
                            className: 'text-lg text-gray-400 max-w-2xl mx-auto'
                        }, 'Plateforme de développement cloud avec IA intégrée et analytics avancés')
                    ),

                    React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-8' },
                        React.createElement('div', { className: 'glass-card p-8 rounded-2xl' },
                            React.createElement('h2', { 
                                className: 'text-2xl font-bold text-white mb-2'
                            }, isLogin ? 'Connexion' : 'Inscription'),
                            
                            message && React.createElement('div', {
                                className: `p-4 rounded-xl mb-6 ${
                                    message.includes('✅') ? 'bg-green-500/20 border border-green-500/30' : 'bg-red-500/20 border border-red-500/30'
                                }`
                            }, message),
                            
                            React.createElement('form', { onSubmit: handleSubmit, className: 'space-y-4' },
                                !isLogin && [
                                    React.createElement('div', { key: 'username' },
                                        React.createElement('label', { 
                                            className: 'block text-sm font-medium text-gray-300 mb-2'
                                        }, 'Nom d\'utilisateur'),
                                        React.createElement('input', {
                                            type: 'text',
                                            required: true,
                                            className: 'w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white',
                                            placeholder: 'votre-username',
                                            value: formData.username,
                                            onChange: (e) => setFormData({...formData, username: e.target.value})
                                        })
                                    ),
                                    React.createElement('div', { key: 'fullname' },
                                        React.createElement('label', { 
                                            className: 'block text-sm font-medium text-gray-300 mb-2'
                                        }, 'Nom complet'),
                                        React.createElement('input', {
                                            type: 'text',
                                            className: 'w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white',
                                            placeholder: 'John Doe',
                                            value: formData.full_name,
                                            onChange: (e) => setFormData({...formData, full_name: e.target.value})
                                        })
                                    )
                                ],
                                
                                React.createElement('div', null,
                                    React.createElement('label', { 
                                        className: 'block text-sm font-medium text-gray-300 mb-2'
                                    }, 'Email'),
                                    React.createElement('input', {
                                        type: 'email',
                                        required: true,
                                        className: 'w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white',
                                        placeholder: 'vous@entreprise.com',
                                        value: formData.email,
                                        onChange: (e) => setFormData({...formData, email: e.target.value})
                                    })
                                ),
                                
                                React.createElement('div', null,
                                    React.createElement('label', { 
                                        className: 'block text-sm font-medium text-gray-300 mb-2'
                                    }, 'Mot de passe'),
                                    React.createElement('input', {
                                        type: 'password',
                                        required: true,
                                        className: 'w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white',
                                        placeholder: '••••••••',
                                        value: formData.password,
                                        onChange: (e) => setFormData({...formData, password: e.target.value})
                                    })
                                ),
                                
                                React.createElement('button', {
                                    type: 'submit',
                                    disabled: loading,
                                    className: 'btn-primary w-full py-3 text-lg font-semibold'
                                }, loading ? 'Chargement...' : (isLogin ? 'Se connecter' : 'Créer un compte'))
                            ),
                            
                            React.createElement('div', { className: 'text-center mt-4' },
                                React.createElement('button', {
                                    onClick: () => setIsLogin(!isLogin),
                                    className: 'text-blue-400 hover:text-blue-300 font-medium'
                                }, isLogin ? 'Nouveau sur initHUB ? Créer un compte' : 'Déjà un compte ? Se connecter')
                            )
                        ),

                        React.createElement('div', null,
                            React.createElement('h3', { 
                                className: 'text-2xl font-bold text-white mb-6'
                            }, 'Fonctionnalités'),
                            React.createElement('div', { className: 'space-y-4' },
                                features.map((feature, index) =>
                                    React.createElement('div', {
                                        key: index,
                                        className: 'glass-card p-6 rounded-xl'
                                    },
                                        React.createElement('div', { className: 'flex items-start space-x-4' },
                                            React.createElement('span', { className: 'text-2xl' }, feature.icon),
                                            React.createElement('div', null,
                                                React.createElement('h4', { 
                                                    className: 'text-lg font-semibold text-white mb-2'
                                                }, feature.title),
                                                React.createElement('p', { 
                                                    className: 'text-gray-400'
                                                }, feature.description)
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }

        function DashboardPage() {
            const { user } = useAuth();

            if (!user) return null;

            return React.createElement('div', { className: 'max-w-7xl mx-auto space-y-8' },
                React.createElement('div', null,
                    React.createElement('h1', { className: 'text-3xl font-bold text-white mb-2' }, 'Tableau de Bord'),
                    React.createElement('p', { className: 'text-gray-400' }, 'Bienvenue sur votre espace de travail initHUB')
                ),

                React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6' },
                    React.createElement(StatsCard, {
                        title: 'Repositories',
                        value: '12',
                        description: 'Dépôts actifs',
                        trend: 12
                    }),
                    React.createElement(StatsCard, {
                        title: 'Stars',
                        value: '45',
                        description: 'Total des étoiles',
                        trend: 8
                    }),
                    React.createElement(StatsCard, {
                        title: 'Forks',
                        value: '8',
                        description: 'Dépôts forkés',
                        trend: 5
                    }),
                    React.createElement(StatsCard, {
                        title: 'Contributeurs',
                        value: '5',
                        description: 'Membres actifs',
                        trend: 3
                    })
                ),

                React.createElement('div', { className: 'glass-card p-6' },
                    React.createElement('h3', { className: 'text-lg font-semibold text-white mb-4' }, 'Activité Récente'),
                    React.createElement('div', { className: 'space-y-4' },
                        React.createElement('div', { className: 'flex items-center space-x-4 p-4 bg-gray-800/30 rounded-xl' },
                            React.createElement('span', {}, createIcon('GitBranch')),
                            React.createElement('div', { className: 'flex-1' },
                                React.createElement('p', { className: 'text-white font-medium' }, 'Repository mon-projet créé'),
                                React.createElement('p', { className: 'text-gray-400 text-sm' }, 'Nouveau dépôt initialisé')
                            ),
                            React.createElement('div', { className: 'text-right' },
                                React.createElement('p', { className: 'text-gray-400 text-sm' }, new Date().toLocaleDateString('fr-FR'))
                            )
                        )
                    )
                )
            );
        }

        function ReposPage() {
            const { user } = useAuth();
            const [repos, setRepos] = useState([]);

            useEffect(() => {
                if (!user) {
                    window.location.hash = '';
                    return;
                }

                // Données simulées
                setRepos([
                    {
                        id: 1,
                        name: 'mon-projet',
                        full_name: `${user.username}/mon-projet`,
                        description: 'Application web moderne avec React et Node.js',
                        is_private: false,
                        stars_count: 15,
                        forks_count: 3,
                        language: 'JavaScript',
                        updated_at: new Date().toISOString()
                    }
                ]);
            }, [user]);

            if (!user) return null;

            return React.createElement('div', { className: 'max-w-7xl mx-auto space-y-8' },
                React.createElement('div', { className: 'flex items-center justify-between' },
                    React.createElement('div', null,
                        React.createElement('h1', { className: 'text-3xl font-bold text-white mb-2' }, 'Mes Repositories'),
                        React.createElement('p', { className: 'text-gray-400' }, 'Gérez tous vos dépôts de code')
                    ),
                    React.createElement('button', { className: 'btn-primary flex items-center' },
                        createIcon('Plus'),
                        React.createElement('span', { className: 'ml-2' }, 'Nouveau Repository')
                    )
                ),

                React.createElement('div', { className: 'grid grid-cols-1 gap-6' },
                    repos.map((repo) =>
                        React.createElement('div', { key: repo.id, className: 'repo-card' },
                            React.createElement('div', { className: 'flex items-start justify-between mb-4' },
                                React.createElement('div', { className: 'flex items-center space-x-3' },
                                    React.createElement('span', { className: 'text-2xl' }, createIcon('FolderGit2')),
                                    React.createElement('div', null,
                                        React.createElement('h3', { className: 'text-xl font-semibold text-white' }, repo.name),
                                        React.createElement('p', { className: 'text-gray-400 text-sm' }, repo.full_name)
                                    )
                                ),
                                React.createElement('div', { className: 'flex items-center space-x-2' },
                                    repo.is_private ? 
                                        createIcon('Lock') :
                                        createIcon('Globe')
                                )
                            ),
                            
                            React.createElement('p', { className: 'text-gray-300 mb-4' }, repo.description),
                            
                            React.createElement('div', { className: 'flex items-center justify-between text-sm' },
                                React.createElement('div', { className: 'flex items-center space-x-4 text-gray-400' },
                                    React.createElement('span', null, repo.language),
                                    React.createElement('span', { className: 'flex items-center' },
                                        createIcon('Star'),
                                        React.createElement('span', { className: 'ml-1' }, repo.stars_count)
                                    ),
                                    React.createElement('span', { className: 'flex items-center' },
                                        createIcon('GitFork'),
                                        React.createElement('span', { className: 'ml-1' }, repo.forks_count)
                                    )
                                ),
                                React.createElement('div', { className: 'text-gray-500' },
                                    Mis à jour le {new Date(repo.updated_at).toLocaleDateString('fr-FR')}
                                )
                            )
                        )
                    )
                )
            );
        }

        function CopilotPage() {
            const { user, token } = useAuth();
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);

            const sendMessage = async () => {
                if (!input.trim() || loading) return;

                const userMessage = {
                    id: Date.now(),
                    type: 'user',
                    content: input,
                    timestamp: new Date()
                };

                setMessages(prev => [...prev, userMessage]);
                setInput('');
                setLoading(true);

                try {
                    const response = await fetch('https://hubs-pro.onrender.com/api/copilot/ask', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            question: input,
                            language: 'fr'
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Erreur API Copilot');
                    }

                    const data = await response.json();

                    const botMessage = {
                        id: Date.now() + 1,
                        type: 'bot',
                        content: data.response,
                        timestamp: new Date()
                    };

                    setMessages(prev => [...prev, botMessage]);
                } catch (error) {
                    console.error('Erreur Copilot:', error);
                    
                    const errorMessage = {
                        id: Date.now() + 1,
                        type: 'bot',
                        content: 'Désolé, une erreur est survenue. Veuillez réessayer.',
                        timestamp: new Date()
                    };
                    
                    setMessages(prev => [...prev, errorMessage]);
                } finally {
                    setLoading(false);
                }
            };

            if (!user) return null;

            return React.createElement('div', { className: 'max-w-4xl mx-auto space-y-8' },
                React.createElement('div', null,
                    React.createElement('h1', { className: 'text-3xl font-bold text-white mb-2' }, 'initHUB Copilot'),
                    React.createElement('p', { className: 'text-gray-400' }, 'Votre assistant IA pour le développement')
                ),

                React.createElement('div', { className: 'glass-card p-6' },
                    React.createElement('div', { className: 'h-96 overflow-y-auto mb-4 space-y-4' },
                        messages.length === 0 && 
                            React.createElement('div', { className: 'text-center py-12' },
                                React.createElement('span', { className: 'text-4xl mb-4 block' }, createIcon('Bot')),
                                React.createElement('h3', { className: 'text-xl font-bold text-white mb-2' }, 'initHUB Copilot'),
                                React.createElement('p', { className: 'text-gray-400' }, 'Comment puis-je vous aider aujourd\'hui ?')
                            ),
                        
                        messages.map((message) =>
                            React.createElement('div', {
                                key: message.id,
                                className: `chat-message ${message.type === 'user' ? 'chat-user' : 'chat-bot'}`
                            },
                                React.createElement('p', { className: 'text-white' }, message.content),
                                React.createElement('p', { className: 'text-xs opacity-70 mt-1 text-right' },
                                    message.timestamp.toLocaleTimeString('fr-FR')
                                )
                            )
                        ),
                        
                        loading && 
                            React.createElement('div', { className: 'chat-message chat-bot' },
                                React.createElement('div', { className: 'flex space-x-2' },
                                    React.createElement('div', { 
                                        className: 'w-2 h-2 bg-gray-400 rounded-full animate-bounce' 
                                    }),
                                    React.createElement('div', { 
                                        className: 'w-2 h-2 bg-gray-400 rounded-full animate-bounce',
                                        style: { animationDelay: '0.2s' }
                                    }),
                                    React.createElement('div', { 
                                        className: 'w-2 h-2 bg-gray-400 rounded-full animate-bounce',
                                        style: { animationDelay: '0.4s' }
                                    })
                                )
                            )
                    ),

                    React.createElement('div', { className: 'flex space-x-4' },
                        React.createElement('input', {
                            type: 'text',
                            value: input,
                            onChange: (e) => setInput(e.target.value),
                            onKeyPress: (e) => {
                                if (e.key === 'Enter') sendMessage();
                            },
                            placeholder: 'Posez votre question à Copilot...',
                            className: 'flex-1',
                            disabled: loading
                        }),
                        React.createElement('button', {
                            onClick: sendMessage,
                            disabled: loading || !input.trim(),
                            className: 'btn-primary'
                        }, createIcon('Send'))
                    )
                )
            );
        }

        // Pages simplifiées
        function ReleasesPage() {
            const { user } = useAuth();
            if (!user) return null;

            return React.createElement('div', { className: 'max-w-7xl mx-auto space-y-8' },
                React.createElement('h1', { className: 'text-3xl font-bold text-white' }, 'Releases'),
                React.createElement('p', { className: 'text-gray-400' }, 'Gérez les versions de vos projets')
            );
        }

        function WikiPage() {
            const { user } = useAuth();
            if (!user) return null;

            return React.createElement('div', { className: 'max-w-7xl mx-auto space-y-8' },
                React.createElement('h1', { className: 'text-3xl font-bold text-white' }, 'Wiki'),
                React.createElement('p', { className: 'text-gray-400' }, 'Documentation de vos projets')
            );
        }

        function AnalyticsPage() {
            const { user } = useAuth();
            if (!user) return null;

            return React.createElement('div', { className: 'max-w-7xl mx-auto space-y-8' },
                React.createElement('h1', { className: 'text-3xl font-bold text-white' }, 'Analytics'),
                React.createElement('p', { className: 'text-gray-400' }, 'Statistiques et métriques')
            );
        }

        // Router principal
        function App() {
            const [currentRoute, setCurrentRoute] = useState(window.location.hash.replace('#', '') || 'dashboard');

            useEffect(() => {
                const handleHashChange = () => {
                    setCurrentRoute(window.location.hash.replace('#', '') || 'dashboard');
                };

                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            let CurrentPage = HomePage;
            switch (currentRoute) {
                case 'dashboard':
                    CurrentPage = DashboardPage;
                    break;
                case 'repos':
                    CurrentPage = ReposPage;
                    break;
                case 'copilot':
                    CurrentPage = CopilotPage;
                    break;
                case 'releases':
                    CurrentPage = ReleasesPage;
                    break;
                case 'wiki':
                    CurrentPage = WikiPage;
                    break;
                case 'analytics':
                    CurrentPage = AnalyticsPage;
                    break;
                default:
                    CurrentPage = HomePage;
            }

            return React.createElement(AuthProvider, null,
                React.createElement(Layout, null,
                    React.createElement(CurrentPage)
                )
            );
        }

        // Rendu de l'application
        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
