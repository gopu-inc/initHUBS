<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - initHUB Cloud</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 400px; margin: 20px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="assets/logo.png" alt="initHUB" height="60">
            <h2>Connexion initHUB</h2>
            <p>Accédez à votre dashboard cloud</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            
            <button type="submit" class="btn primary" style="width: 100%;">
                <i class="fas fa-sign-in-alt"></i> Se connecter
            </button>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="display: block; margin: 10px 0;">← Retour à l'accueil</a>
                <a href="https://hubs-ja2g.onrender.com/api/docs" target="_blank" style="display: block;">
                    <i class="fas fa-code"></i> Accéder à l'API
                </a>
            </div>
        </form>
    </div>
    
    <script src="api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> Connexion...';
            btn.disabled = true;
            
            try {
                await window.initHUB.login(email, password);
                window.location.href = 'app.html';
            } catch (error) {
                alert('Erreur: ' + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
        
        // Vérifier si déjà connecté
        if (localStorage.getItem('inithub_token')) {
            window.initHUB.getCurrentUser().then(user => {
                if (user) window.location.href = 'app.html';
            });
        }
    </script>
</body>
</html>
